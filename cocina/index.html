<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Central de la Casa</title>

<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Casa">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js">
/* ============================================================================
   store-supabase.js · El driver que saca los datos de adentro de la app
   ----------------------------------------------------------------------------
   Esto es el pago del paso 6. store.js dejó una sola puerta al almacenamiento;
   acá se cambia lo que hay al otro lado de la puerta y la app no se entera.
   Ni un solo sget/sset del archivo principal cambia.

   Tres cosas que el storage del artifact no podía dar:
     · los datos sobreviven a publicar una versión nueva
     · la tablet se entera sola cuando editas desde el teléfono (tiempo real)
     · si se cae internet, la app sigue andando con lo último que vio

   Uso:
     const S = Store.create({ driver: await SupabaseDriver({ url, key, hogarId }) });
   ========================================================================== */
(function (root) {
  "use strict";

  var CACHE_LOCAL = "cc:cache:";     // espejo en el dispositivo, para modo avión

  function leerLocal(k) {
    try { var v = localStorage.getItem(CACHE_LOCAL + k); return v === null ? null : v; }
    catch (e) { return null; }
  }
  function escribirLocal(k, v) {
    try { v === null ? localStorage.removeItem(CACHE_LOCAL + k)
                     : localStorage.setItem(CACHE_LOCAL + k, v); }
    catch (e) { /* cuota llena: el espejo es un lujo, no puede voltear nada */ }
  }

  /* La llave y el hogar viajan en el fragmento del link (#...), que nunca sale
     del dispositivo ni queda en el repositorio. Primera visita: se lee y se
     guarda. De ahí en adelante el ícono entra solo.                          */
  function credenciales() {
    var f = (location.hash || "").replace(/^#/, "");
    if (f) {
      var p = new URLSearchParams(f), c = {
        url: p.get("u"), key: p.get("k"), email: p.get("e"), pass: p.get("p")
      };
      if (c.url && c.key && c.email && c.pass) {
        try { localStorage.setItem("cc:cred", JSON.stringify(c)); } catch (e) {}
        history.replaceState(null, "", location.pathname + location.search);
        return c;
      }
    }
    try { return JSON.parse(localStorage.getItem("cc:cred") || "null"); }
    catch (e) { return null; }
  }

  async function SupabaseDriver(opts) {
    opts = opts || {};
    var cred = opts.cred || credenciales();
    if (!cred) throw new Error("SIN_CREDENCIALES");

    var sb = root.supabase.createClient(cred.url, cred.key, {
      auth: { persistSession: true, autoRefreshToken: true }
    });

    var ses = await sb.auth.getSession();
    if (!ses.data.session) {
      var r = await sb.auth.signInWithPassword({ email: cred.email, password: cred.pass });
      if (r.error) throw new Error("LOGIN_FALLIDO: " + r.error.message);
    }

    var m = await sb.from("miembros").select("hogar_id").single();
    if (m.error || !m.data) throw new Error("SIN_HOGAR");
    var hogarId = m.data.hogar_id;

    var enVivo = [];

    /* Tiempo real: cualquier cambio en la base llega acá y se avisa hacia
       arriba, para que la pantalla se redibuje sola.                        */
    sb.channel("kv-" + hogarId)
      .on("postgres_changes",
          { event: "*", schema: "public", table: "kv", filter: "hogar_id=eq." + hogarId },
          function (p) {
            var fila = p.new || p.old;
            if (!fila) return;
            var val = p.eventType === "DELETE" ? null : JSON.stringify(fila.v);
            escribirLocal(fila.k, val);
            enVivo.forEach(function (fn) {
              try { fn(fila.k, val, p.eventType); } catch (e) {}
            });
          })
      .subscribe();

    return {
      nombre: "supabase",
      disponible: true,
      hogarId: hogarId,

      /* Devuelve string, igual que el driver viejo: store.js se encarga del
         JSON. Si la red falla, cae al espejo local en vez de morir.          */
      get: async function (k) {
        try {
          var r = await sb.from("kv").select("v").eq("hogar_id", hogarId).eq("k", k).maybeSingle();
          if (r.error) throw r.error;
          var s = r.data ? JSON.stringify(r.data.v) : null;
          escribirLocal(k, s);
          return s;
        } catch (e) { return leerLocal(k); }
      },

      set: async function (k, raw) {
        var v; try { v = JSON.parse(raw); } catch (e) { v = raw; }
        escribirLocal(k, raw);
        var r = await sb.from("kv").upsert({ hogar_id: hogarId, k: k, v: v },
                                           { onConflict: "hogar_id,k" });
        if (r.error) throw r.error;
        return { key: k, value: raw };
      },

      del: async function (k) {
        escribirLocal(k, null);
        var r = await sb.from("kv").delete().eq("hogar_id", hogarId).eq("k", k);
        if (r.error) throw r.error;
        return { key: k, deleted: true };
      },

      list: async function (prefijo) {
        try {
          var q = sb.from("kv").select("k").eq("hogar_id", hogarId);
          if (prefijo) q = q.like("k", prefijo + "%");
          var r = await q;
          if (r.error) throw r.error;
          return r.data.map(function (x) { return x.k; });
        } catch (e) {
          var out = [];
          try {
            for (var i = 0; i < localStorage.length; i++) {
              var kk = localStorage.key(i);
              if (kk && kk.indexOf(CACHE_LOCAL) === 0) {
                var real = kk.slice(CACHE_LOCAL.length);
                if (!prefijo || real.indexOf(prefijo) === 0) out.push(real);
              }
            }
          } catch (e2) {}
          return out;
        }
      },

      /* El historial no pasa por kv: es append-only y con permisos propios. */
      anotar: async function (tipo, actor, payload) {
        var r = await sb.from("historial")
          .insert({ hogar_id: hogarId, tipo: tipo, actor: actor, payload: payload });
        if (r.error) throw r.error;
        return true;
      },

      onCambio: function (fn) {
        enVivo.push(fn);
        return function () { enVivo = enVivo.filter(function (x) { return x !== fn; }); };
      },

      cerrarSesion: function () {
        try { localStorage.removeItem("cc:cred"); } catch (e) {}
        return sb.auth.signOut();
      },

      _sb: sb
    };
  }

  root.SupabaseDriver = SupabaseDriver;
  root.credencialesCC = credenciales;
  if (typeof module !== "undefined" && module.exports) module.exports = SupabaseDriver;
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF7F0; --card:#FFFFFF; --ink:#20283E; --ink-soft:#5B6377;
  --line:#E3DDCE; --line-strong:#C9C2AF;
  --hoy:#F1B33B; --hoy-soft:#FBEED3;
  --due:#D6472E; --due-soft:#F9E4DF;
  --ok:#2E7D5B; --ok-soft:#E2EFE8;
  --colD:#3E68C8; --colD-soft:#E4EBF9;
  --colJ:#E07B39; --colJ-soft:#FBEADC;
  --colJo:#7A4EA3; --colJo-soft:#EFE7F7;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Archivo",system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;padding-bottom:90px}
.mono{font-family:"Space Mono",monospace}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--colD);outline-offset:2px;border-radius:6px}

header{border-bottom:2px solid var(--ink);padding:20px 24px 16px;overflow:hidden;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.brand .eyebrow{font-family:"Space Mono",monospace;font-size:.7rem;letter-spacing:.28em;color:var(--ink-soft);text-transform:uppercase}
.brand h1{font-weight:800;font-size:clamp(1.4rem,3vw,2rem);letter-spacing:.14em;text-transform:uppercase;margin-top:4px}
.brand .restr{font-size:.85rem;color:var(--ink-soft);margin-top:6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chipJ{background:var(--colJ-soft);color:#9A4E12;border-radius:99px;padding:4px 11px;font-weight:600;font-size:.8rem}
.chipD{background:var(--colD-soft);color:#27458C;border-radius:99px;padding:4px 11px;font-weight:600;font-size:.8rem}
.sync{font-family:"Space Mono",monospace;font-size:.62rem;letter-spacing:.1em;color:var(--ink-soft);text-transform:uppercase}
.sync b{color:var(--ok)}
.clock{text-align:right}
.clock .t{font-family:"Space Mono",monospace;font-weight:700;font-size:clamp(1.7rem,3.6vw,2.4rem);line-height:1;font-variant-numeric:tabular-nums}
.clock .d{font-family:"Space Mono",monospace;font-size:.78rem;color:var(--ink-soft);margin-top:5px;text-transform:uppercase;letter-spacing:.06em}

nav{display:flex;border-bottom:1px solid var(--line-strong);padding:0 24px;gap:4px;overflow-x:auto}
.tab{min-height:56px;padding:0 22px;font-weight:600;font-size:.98rem;color:var(--ink-soft);border-bottom:3px solid transparent;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tab.active{color:var(--ink);border-bottom-color:var(--hoy)}
.tab .count{font-family:"Space Mono",monospace;font-size:.72rem;background:var(--ink);color:var(--paper);padding:2px 8px;border-radius:99px}

main{padding:22px 24px;max-width:1600px;margin:0 auto}
.board-wrap{display:flex;flex-direction:column;gap:16px}
.board{display:flex;gap:10px;align-items:stretch}
.board > .col{flex:1 1 0;min-width:0}
.board > .col.today{flex:1.7 1 0}
.board > .col.future{flex:1 1 0}
/* Días pasados: bloque compacto (izquierda) */
.side-wrap{display:flex;gap:6px;flex:0 0 auto;align-items:stretch;position:relative}
.past-side{padding-right:10px;margin-right:2px;border-right:2px dashed var(--line-strong)}
.side-label{position:absolute;top:-8px;left:4px;font-family:"Space Mono",monospace;font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);background:var(--paper);padding:0 6px}
.col.past{flex:0 0 84px;min-height:auto;opacity:.5;background:var(--paper)}
.col.past:active{opacity:.85}
.col.past .col-head{padding:9px 8px 7px;border-bottom:1px dashed var(--line);display:block}
.col.past .col-meal{padding:9px 8px}
.col.past .mname{font-weight:600}
.col.future{opacity:.9}
.col.future .mname{font-size:.98rem}
/* ---- iPad horizontal (≈1024px) y pantallas medianas: semana completa arriba, paneles abajo ---- */
@media(max-width:1349px){
  .rail{grid-template-columns:repeat(2,1fr)}
}
/* Cualquier pantalla ancha pero baja (tablets acostadas): paneles en
   carrusel, para que el menú del día no quede fuera de la vista. */
@media (min-width:900px) and (max-height:820px){
  .rail{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;padding-bottom:4px}
  .rail > *{flex:0 0 300px;scroll-snap-align:start;max-height:calc(100vh - 500px);
    min-height:180px;overflow-y:auto}
}
/* El tablero nunca empuja el ancho de la página */
.board{max-width:100%}
.board-wrap{min-width:0}
main{overflow-x:hidden}
@media(min-width:900px) and (max-width:1349px){
  main{padding:14px 16px}
  .board{gap:8px}
  .col{min-height:270px}
  .col-head{padding:9px 10px 8px}
  .col-head .dname{font-size:.72rem}
  .col-head .dnum{font-size:.64rem}
  .col-meal{padding:10px}
  .col-meal .mname{font-size:.92rem}
  .col-sub{padding:0 10px 10px;font-size:.73rem}
  .col-evts{padding:8px 10px 10px}
  .cev{font-size:.72rem}
  .col.past{flex:0 0 70px}
  .col.future .mname{font-size:.88rem}
  .panel{padding:14px}
  header{padding:14px 16px 12px}
  nav{padding:0 16px}
}
.col{background:var(--card);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:330px;overflow:hidden;text-align:left;transition:box-shadow .15s}
.col:active{box-shadow:0 4px 14px rgba(32,40,62,.12)}
.col.today{border:2px solid var(--ink);box-shadow:0 10px 26px rgba(32,40,62,.14)}
.col-head{padding:12px 14px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:6px}
.col.today .col-head{background:var(--hoy);border-bottom-color:var(--ink)}
.col-head .dname{font-family:"Space Mono",monospace;font-weight:700;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase}
.col-head .dnum{font-family:"Space Mono",monospace;font-size:.72rem;color:var(--ink-soft)}
.col.today .col-head .dnum{color:var(--ink)}
.hoy-tag{font-family:"Space Mono",monospace;font-size:.62rem;font-weight:700;letter-spacing:.14em;background:var(--ink);color:var(--hoy);padding:3px 8px;border-radius:4px}
.col-meal{padding:14px}
.k{font-family:"Space Mono",monospace;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.col-meal .mname{font-weight:800;font-size:1.08rem;line-height:1.25}
.col-meal .meta{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.pill{font-family:"Space Mono",monospace;font-size:.62rem;padding:3px 7px;border-radius:4px;letter-spacing:.04em}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.tag{background:var(--hoy-soft);color:#8A6410}
.pill.dots{color:var(--ink-soft);letter-spacing:2px;background:none;padding:0}
.col-sub{padding:0 14px 12px;font-size:.82rem;color:var(--ink-soft);line-height:1.5}
.col-sub b{color:var(--ink);font-weight:600}
.col-evts{border-top:1px dashed var(--line);padding:10px 14px 14px;margin-top:auto}
.cev{display:flex;gap:8px;font-size:.8rem;line-height:1.45;padding:3px 0}
.cev .t{font-family:"Space Mono",monospace;font-weight:700;font-size:.72rem;flex:none;padding-top:2px}
.cev.none{color:var(--line-strong);font-family:"Space Mono",monospace;font-size:.72rem;letter-spacing:.08em}

.rail{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
.head-right{display:flex;align-items:center;gap:22px;min-width:0;max-width:100%}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel h2{font-family:"Space Mono",monospace;font-size:.72rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:2px solid var(--ink);margin-bottom:12px}
.panel h2 .soft{color:var(--ink-soft);letter-spacing:0}
.empty{
  border:1.5px dashed var(--line-strong);border-radius:12px;padding:16px;
  font-size:.85rem;color:var(--ink-soft);line-height:1.55;background:var(--paper);
}
.empty b{color:var(--ink)}
.med{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px 4px;border-bottom:1px solid var(--line);min-height:62px}
.med:last-of-type{border-bottom:none}
.med .box{width:30px;height:30px;border:2px solid var(--line-strong);border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.95rem;transition:all .12s}
.med.done .box{background:var(--ok);border-color:var(--ok)}
.med .mt{font-family:"Space Mono",monospace;font-weight:700;font-size:.92rem;width:50px;flex:none;font-variant-numeric:tabular-nums}
.med.due .mt{color:var(--due)}
.med .mi{flex:1;min-width:0}
.med .mn{font-weight:600;font-size:.94rem}
.med.done .mn{text-decoration:line-through;color:var(--ink-soft)}
.med .mnote{font-size:.76rem;color:var(--ink-soft);margin-top:1px}
.kdot{width:10px;height:10px;border-radius:50%;flex:none}
.kdot.D{background:var(--colD)} .kdot.J{background:var(--colJ)} .kdot.Dm{background:var(--line-strong)}

/* ---- La Nevera: tandas cocinadas y su vida útil ---- */
.nv{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);min-height:56px}
.nv:last-child{border-bottom:none}
.nv .ni{flex:1;min-width:0}
.nv .nn{font-weight:600;font-size:.92rem}
.nv .nd{font-family:"Space Mono",monospace;font-size:.7rem;color:var(--ink-soft);margin-top:2px}
.nv .np{font-family:"Space Mono",monospace;font-weight:700;font-size:.86rem;flex:none;
  background:var(--ok-soft);color:var(--ok);padding:5px 9px;border-radius:6px}
.nv.urge .np{background:var(--due-soft);color:var(--due)}
.nv.frio .np{background:var(--colD-soft);color:#27458C}
.nvbtn{border:1px solid var(--line-strong);border-radius:9px;min-height:40px;padding:0 12px;
  font-size:.78rem;font-weight:600;color:var(--ink-soft);flex:none}
.nvbtn:active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.banq{background:var(--colD-soft);border-left:4px solid var(--colD);border-radius:0 10px 10px 0;
  padding:11px 14px;margin-top:10px}
.banq .bk{font-family:"Space Mono",monospace;font-size:.6rem;letter-spacing:.16em;
  text-transform:uppercase;color:#27458C}
.banq .bn{font-weight:700;font-size:.95rem;margin-top:3px;line-height:1.3}
.banq .bd{font-size:.76rem;color:var(--ink-soft);margin-top:3px;line-height:1.4}
.tanda{background:var(--ok-soft);border-left:4px solid var(--ok);border-radius:0 10px 10px 0;
  padding:11px 14px;margin-top:12px;font-size:.85rem;line-height:1.55}
.tanda b{color:var(--ok)}
.agtag{font-family:"Space Mono",monospace;font-size:.56rem;letter-spacing:.08em;
  padding:2px 6px;border-radius:4px;background:var(--colD-soft);color:#27458C;flex:none}
.imp-box{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.imp-box textarea{width:100%;border:1.5px solid var(--line-strong);border-radius:10px;
  padding:10px 12px;font:inherit;font-size:.82rem;background:var(--paper);min-height:70px;
  font-family:"Space Mono",monospace;resize:vertical}
.duetag{font-family:"Space Mono",monospace;font-size:.6rem;font-weight:700;letter-spacing:.1em;color:var(--due);flex:none}
.legend{display:flex;gap:14px;margin-top:10px;font-size:.76rem;color:var(--ink-soft)}
.legend span{display:flex;align-items:center;gap:6px}

/* ---- Remedios derivados del historial ---- */
.tsec{font-family:"Space Mono",monospace;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin:14px 0 6px}
.tsec:first-of-type{margin-top:0}
.trow{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);min-height:62px}
.trow:last-child{border-bottom:none}
.trow .ti{flex:1;min-width:0}
.trow .tn{font-weight:700;font-size:.94rem;display:flex;align-items:center;gap:7px}
.trow .td{font-size:.78rem;color:var(--ink-soft);margin-top:2px;line-height:1.4}
.dosebox{display:flex;align-items:center;gap:6px;flex:none}
.dosebtn{width:38px;height:38px;border:2px solid var(--line-strong);border-radius:10px;font-weight:800;font-size:1.05rem;display:flex;align-items:center;justify-content:center;color:var(--ink-soft)}
.dosebtn:active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dosectr{font-family:"Space Mono",monospace;font-weight:700;font-size:.86rem;min-width:38px;text-align:center;font-variant-numeric:tabular-nums}
.dosectr.full{color:var(--ok)}
.dosectr.over{color:var(--due)}
.warnbox{background:var(--due-soft);border:1px solid var(--due);border-left:4px solid var(--due);border-radius:0 10px 10px 0;padding:11px 13px;font-size:.82rem;line-height:1.5;margin-bottom:12px}
.warnbox b{color:var(--due)}
.sosbadge{font-family:"Space Mono",monospace;font-size:.56rem;letter-spacing:.08em;background:var(--hoy-soft);color:#8A6410;padding:2px 7px;border-radius:4px;text-transform:uppercase}

/* ---- Valoración de recetas ---------------------------------------------
   Todo bajo el prefijo .rt- para no colisionar con nada existente.
   Estrellas de 52px: se aciertan de pie, con las manos ocupadas.        */
.rt-t{font-weight:700;font-size:1.02rem;line-height:1.25}
.rt-f{font-family:"Space Mono",monospace;font-size:.66rem;letter-spacing:.04em;color:var(--ink-soft);margin-top:4px;line-height:1.4}
.rt-q{font-size:.83rem;color:var(--ink-soft);margin:12px 0 4px}
.rt-stars{display:flex;gap:2px;margin-left:-6px}
.rt-star{width:52px;height:52px;font-size:31px;line-height:1;color:var(--line-strong);
  transition:color .12s ease,transform .12s ease}
.rt-star:active{transform:scale(1.1)}
.rt-star.rt-on{color:var(--hoy)}
.rt-star:focus-visible{outline:3px solid var(--colD);outline-offset:2px;border-radius:8px}
.rt-quien{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.rt-chip{padding:9px 14px;min-height:44px;border:1px solid var(--line-strong);
  border-radius:999px;font-size:.84rem;font-weight:600;color:var(--ink-soft)}
.rt-chip[data-quien="J"].rt-on{background:var(--colJ-soft);border-color:var(--colJ);color:#9A4E12}
.rt-chip[data-quien="D"].rt-on{background:var(--colD-soft);border-color:var(--colD);color:#27458C}

/* ---- Encuadre fijo -------------------------------------------------------
   El intento anterior daba min-height y centraba el contenido. Eso pone piso
   a la caja pero deja que lo de adentro flote: con un nombre de una línea
   todo sube, con tres baja, y las porciones de cada día quedan a distinta
   altura. La corrección es reservar SIEMPRE dos líneas para el nombre y
   anclar arriba, no centrar. Así porciones y Banquete caen solos en la misma
   línea horizontal en todas las columnas.                                   */
/* Un solo alto para la zona de il pranzo en TODAS las columnas, incluida HOY.
   Sin esto el Banquete de hoy queda 40 px más abajo que el del resto, porque
   la viñeta de hoy carga estrellas y chips que las otras no tienen. El alto
   lo fija la columna más cargada; las demás dejan aire, que es el precio de
   que los cinco Banquetes caigan en la misma línea.                         */
:root{--h-pranzo:152px}
.col-open,.col-rate{height:var(--h-pranzo);display:flex;flex-direction:column;align-items:flex-start}
.col.future .col-meal,.col.future .col-open-f > .col-meal{height:var(--h-pranzo);
  display:flex;flex-direction:column;align-items:flex-start;box-sizing:border-box}
/* La cabecera de HOY trae la píldora «HOY» y crecía unos píxeles más que las
   otras, corriendo todo lo de abajo. Mismo alto para las cinco. */
.col-head{min-height:44px;box-sizing:border-box}

/* Dos líneas, ni una más ni una menos. Si el nombre es más largo, se recorta
   con puntos suspensivos: mejor un nombre truncado que una grilla torcida. */
.mname{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;height:2.5em;margin-top:5px}

/* Fila de porciones: altura fija y sin envolver, para que sea el mismo
   renglón en los siete días. */
.col-meal .meta,.col-open .meta{flex-wrap:nowrap;overflow:hidden;
  min-height:26px;margin-top:8px;align-items:center}

/* Banquete: mismo tamaño siempre. Cada pieza de adentro tiene alto fijo, así
   que la caja completa mide igual en todas las columnas sin necesidad de
   forzarla con min-height. */
.col.today .banq,.col.future .banq{display:flex;flex-direction:column;justify-content:flex-start}
.banq .bn{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;height:2.6em}
.banq .bd{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;height:2.8em}

/* (el alto de .col.future .col-meal lo fija --h-pranzo, arriba) */

/* El calendario del día venía apretado y los eventos se deformaban.
   Ahora tiene aire para tres líneas reales. */
.col-evts{min-height:78px}
.col-open-f{display:block;width:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer}

/* ---- El tiranosaurio de las 5 estrellas ---- */
.rex-wrap{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;
  pointer-events:none;background:radial-gradient(circle at 50% 52%,rgba(241,179,59,.5),rgba(32,40,62,.72));
  animation:rexFade 3.2s ease forwards}
.rex-stage{position:relative;display:grid;place-items:center;
  animation:rexEntra .62s cubic-bezier(.2,1.5,.35,1) both}
.rex-img{width:min(62vw,440px);height:auto;display:block;border-radius:22px;
  filter:drop-shadow(0 26px 44px rgba(20,26,14,.55));
  animation:rexFlota 2.4s ease-in-out infinite alternate}
.rex-msg{position:absolute;bottom:-4%;left:50%;transform:translateX(-50%);
  font-weight:800;font-size:clamp(1.5rem,5vw,2.9rem);letter-spacing:.03em;color:#FFF8EA;
  text-shadow:0 5px 0 #D6472E,0 14px 28px rgba(20,26,14,.6);white-space:nowrap;
  animation:rexPop .5s .2s cubic-bezier(.2,1.7,.4,1) both, rexShake 1.2s .7s ease-in-out infinite}

<script>
/* ===== MÓDULOS BASE — generados fuera del HTML, no editar acá =====
   store.js  · única puerta al almacenamiento
   hogar.js  · la casa en un objeto
   Fuente y regeneración: carpeta «Central de la Casa — Sistema» en Drive.
   ================================================================== */
/* ============================================================================
   store.js · Capa de persistencia de Central de la Casa
   ----------------------------------------------------------------------------
   Por qué existe: hoy la app llama a `window.storage` directo, repartido por
   todo el archivo. Eso amarra la app al sistema de artifacts de Claude. Esta
   capa deja UNA sola puerta de salida. El día que haya que migrar a Supabase,
   Firebase o lo que sea, se escribe un driver nuevo y no se toca nada más.

   Además arregla tres cosas molestas del storage crudo:
     · `get` de una clave inexistente LANZA excepción → acá devuelve el default
     · todo es string → acá se serializa/deserializa JSON solo
     · cada lectura es un viaje de red → acá hay caché en memoria

   Uso:
     const S = Store.create({ prefix:"cc:", shared:true });
     await S.ready();
     const falta = await S.get("falta", []);
     await S.set("falta", [...falta, item]);
   ========================================================================== */
(function (root) {
  "use strict";

  /* ---- Reglas de clave del storage subyacente -----------------------------
     Sin espacios, sin / \ ' " y bajo 200 caracteres. Normalizamos en vez de
     fallar: si alguien escribe "menu semana", queda "menu_semana".          */
  var MAX_KEY = 190;
  function sanitizarClave(k) {
    var s = String(k == null ? "" : k).trim()
      .replace(/[\s]+/g, "_")
      .replace(/[\/\\'"]/g, "-");
    if (!s) throw new Error("store: clave vacía");
    if (s.length > MAX_KEY) s = s.slice(0, MAX_KEY);
    return s;
  }

  /* ---- Driver A: window.storage (producción, dentro del artifact) -------- */
  function driverArtifact() {
    var api = root.storage;
    return {
      nombre: "artifact",
      disponible: !!(api && api.get && api.set),
      get: function (k, shared) {
        return api.get(k, shared).then(function (r) {
          return r ? r.value : null;
        }).catch(function () { return null; });   // clave inexistente → null
      },
      set: function (k, v, shared) { return api.set(k, v, shared); },
      del: function (k, shared) { return api.delete(k, shared); },
      list: function (p, shared) {
        return api.list(p, shared).then(function (r) {
          return r && r.keys ? r.keys : [];
        }).catch(function () { return []; });
      }
    };
  }

  /* ---- Driver B: memoria (tests en node, y dev abriendo el HTML local) --- */
  function driverMemoria(seed) {
    var m = Object.assign({}, seed || {});
    return {
      nombre: "memoria",
      disponible: true,
      get: function (k) { return Promise.resolve(k in m ? m[k] : null); },
      set: function (k, v) { m[k] = v; return Promise.resolve({ key: k, value: v }); },
      del: function (k) { delete m[k]; return Promise.resolve({ key: k, deleted: true }); },
      list: function (p) {
        return Promise.resolve(Object.keys(m).filter(function (k) {
          return !p || k.indexOf(p) === 0;
        }));
      },
      _dump: function () { return m; }
    };
  }

  /* ====================================================================== */
  function create(opts) {
    opts = opts || {};
    var prefix = opts.prefix || "cc:";
    var shared = opts.shared !== false;          // por defecto compartido
    var driver = opts.driver || (driverArtifact().disponible
      ? driverArtifact()
      : driverMemoria(opts.seed));

    var cache = Object.create(null);   // clave completa → valor decodificado
    var oyentes = [];
    var estado = { conectado: driver.nombre === "artifact", ultimoError: null };

    function full(k) { return prefix + sanitizarClave(k); }

    function decodificar(raw, fallback) {
      if (raw == null) return fallback;
      if (typeof raw !== "string") return raw;
      try { return JSON.parse(raw); } catch (e) { return raw; }
    }

    function avisar(tipo, clave, valor) {
      for (var i = 0; i < oyentes.length; i++) {
        try { oyentes[i]({ tipo: tipo, clave: clave, valor: valor, estado: estado }); }
        catch (e) { /* un oyente roto no puede voltear la escritura */ }
      }
    }

    var API = {
      driver: driver.nombre,
      estado: estado,

      /* Lectura. NUNCA lanza: si algo falla devuelve el fallback y marca el
         estado como desconectado, para que la UI pueda mostrarlo.           */
      get: function (k, fallback) {
        var fk = full(k);
        if (fk in cache) return Promise.resolve(cache[fk]);
        return driver.get(fk, shared).then(function (raw) {
          var v = decodificar(raw, fallback === undefined ? null : fallback);
          cache[fk] = v;
          estado.conectado = true;
          return v;
        }).catch(function (e) {
          estado.conectado = false; estado.ultimoError = String(e);
          return fallback === undefined ? null : fallback;
        });
      },

      /* Escritura write-through: la caché se actualiza al toque para que la
         UI responda, y si el backend falla se avisa sin perder el valor.     */
      set: function (k, valor) {
        var fk = full(k);
        cache[fk] = valor;
        avisar("set", k, valor);
        var raw = typeof valor === "string" ? valor : JSON.stringify(valor);
        return driver.set(fk, raw, shared).then(function (r) {
          estado.conectado = true; estado.ultimoError = null;
          avisar("sync", k, valor);
          return r;
        }).catch(function (e) {
          estado.conectado = false; estado.ultimoError = String(e);
          avisar("error", k, valor);
          return null;
        });
      },

      del: function (k) {
        var fk = full(k);
        delete cache[fk];
        avisar("del", k, null);
        return driver.del(fk, shared).catch(function () { return null; });
      },

      /* Claves bajo un sub-prefijo, ya sin el prefijo global.
         keys("hist:") → ["hist:2026-08-01", ...]                            */
      keys: function (sub) {
        return driver.list(prefix + (sub || ""), shared).then(function (ks) {
          return ks.map(function (k) { return k.slice(prefix.length); });
        });
      },

      /* Trae todo un sub-árbol en un objeto. Útil para el historial.         */
      getAll: function (sub) {
        return API.keys(sub).then(function (ks) {
          return Promise.all(ks.map(function (k) {
            return API.get(k).then(function (v) { return [k, v]; });
          }));
        }).then(function (pares) {
          var out = {};
          pares.forEach(function (p) { out[p[0]] = p[1]; });
          return out;
        });
      },

      /* Lee-modifica-escribe atómico a nivel de esta pestaña. Evita el bug
         clásico de dos paneles pisándose el mismo array.                     */
      update: function (k, fn, fallback) {
        return API.get(k, fallback).then(function (v) {
          return API.set(k, fn(v));
        });
      },

      /* Escribe varias claves de una. El storage es rate-limited, así que
         conviene agrupar lo que cambia junto en una sola clave — pero cuando
         de verdad son claves distintas, esto al menos las manda en paralelo. */
      setMany: function (obj) {
        return Promise.all(Object.keys(obj).map(function (k) {
          return API.set(k, obj[k]);
        }));
      },

      /* Suscripción para el indicador de "sincronizado" del header.          */
      on: function (fn) {
        oyentes.push(fn);
        return function () { oyentes = oyentes.filter(function (o) { return o !== fn; }); };
      },

      /* Migraciones versionadas. Se corre una vez por versión y queda
         registrado, así se puede cambiar el formato de los datos guardados
         sin romperle la app a la cocina.                                     */
      migrar: function (version, fn) {
        return API.get("_schema", 0).then(function (v) {
          if (v >= version) return false;
          return Promise.resolve(fn(API)).then(function () {
            return API.set("_schema", version);
          }).then(function () { return true; });
        });
      },

      /* Respaldo completo. Es la red de seguridad ante republicar el artifact,
         que estrena storage vacío.                                           */
      exportar: function () {
        return API.getAll("").then(function (todo) {
          return JSON.stringify({
            app: "central-de-la-casa",
            exportado: new Date().toISOString(),
            datos: todo
          }, null, 2);
        });
      },
      importar: function (json) {
        var d = typeof json === "string" ? JSON.parse(json) : json;
        var datos = d && d.datos ? d.datos : d;
        return API.setMany(datos).then(function () { return Object.keys(datos).length; });
      },

      _limpiarCache: function () { cache = Object.create(null); },
      ready: function () { return API.get("_schema", 0).then(function () { return API; }); }
    };

    return API;
  }

  var Store = { create: create, driverMemoria: driverMemoria, sanitizarClave: sanitizarClave };

  root.Store = Store;
  if (typeof module !== "undefined" && module.exports) module.exports = Store;
})(typeof globalThis !== "undefined" ? globalThis : this);

/* ============================================================================
   hogar.js · La casa, en un solo objeto
   ----------------------------------------------------------------------------
   Por qué existe: hoy los nombres de las comidas, los colores de cada persona,
   los horarios y qué paneles se muestran están escritos a mano en veinte
   lugares del HTML. Cambiar una cosa obliga a cazarla por todo el archivo, y
   ahí es donde se rompe el JS.

   Regla de privacidad, deliberada: este esquema NO TIENE campo para nombre
   completo, RUT, dirección ni datos del médico. Una inicial y un color bastan
   para la pantalla de la cocina. Lo que no se guarda no se filtra.
   ========================================================================== */
(function (root) {
  "use strict";

  /* ---- Comidas del día ---------------------------------------------------
     El orden importa: define cómo se dibuja el día en la pantalla.          */
  var COMIDAS = [
    { id: "breakfast", label: "Breakfast",  ancla: "desayuno" },
    { id: "tentenpie", label: "Tentenpié",  ancla: "media_manana" },
    { id: "pranzo",    label: "il pranzo",  ancla: "almuerzo", principal: true },
    { id: "banquete",  label: "Banquete",   ancla: "cena",     principal: true }
  ];

  /* ---- Cocina por tandas -------------------------------------------------
     El Banquete nunca repite il pranzo del mismo día: se cocina una vez, en
     volumen, y los excedentes rotan. Estas constantes son la regla escrita.  */
  var TANDAS = {
    factorPreparacion: 2.5,      // se cocina 2–3× la ración del día
    porcionesExcedente: [2, 4],  // sobran entre 2 y 4 porciones
    vidaUtilDias: 6,             // el excedente no se sirve pasados 6–7 días
    vidaUtilMaxDias: 7,
    repetirTrasDias: 2           // un plato no vuelve a aparecer antes de 2 días
  };

  /* ---- Módulos disponibles ----------------------------------------------
     `edadMin`/`edadMax` en meses. Sirven para dos cosas: encender lo que
     corresponde en esta casa, y —si esto alguna vez es producto— proponerle
     a un hogar nuevo los módulos que le tocan por las edades que cargó.     */
  var MODULOS = {
    menu:      { label: "Menú semanal",  siempre: true },
    faltaAlgo: { label: "Falta algo",    siempre: true },
    compras:   { label: "Compras",       siempre: true },
    historial: { label: "Historial",     siempre: true },
    remedios:  { label: "Remedios",      siempre: true },
    mamadera:  { label: "Mamaderas",     edadMax: 24 },
    siesta:    { label: "Siestas",       edadMax: 48 },
    panales:   { label: "Pañales",       edadMax: 42 },
    colegio:   { label: "Colegio",       edadMin: 60 },
    tareas:    { label: "Tareas",        edadMin: 72 }
  };

  var PALETA = ["#4a7c59", "#c76b4a", "#4a6d8c", "#8c6a4a", "#6d4a8c", "#4a8c85"];

  /* ---- Esquema por defecto ---------------------------------------------- */
  function nuevoHogar(over) {
    var h = {
      version: 1,
      id: "casa",
      alias: "",                    // cómo se llama la casa, no la familia
      zona: "America/Santiago",
      idioma: "es-CL",

      /* Anclas horarias: de acá salen los slots del panel de remedios y la
         hora en que la pantalla cambia de "hoy" a "mañana".                 */
      anclas: {
        desayuno:     "08:00",
        media_manana: "10:30",
        almuerzo:     "13:00",
        media_tarde:  "16:30",
        cena:         "19:30",
        dormir:       "20:30",
        corteDia:     "04:00"
      },

      personas: [],

      /* Proveedor de supermercado y ritmo real de pedido. Lunes = 1.
         Ojo: el ritual se diseñó pensando domingo, pero los pedidos reales
         salen los lunes. Acá queda registrado el dato verdadero.            */
      proveedor: {
        nombre: "Jumbo",
        cadenciaDias: 7,
        diaPedido: 1,
        horaCorte: "20:00"
      },

      modulos: { menu: true, faltaAlgo: true, compras: true, historial: true, remedios: true },
      tandas: Object.assign({}, TANDAS),
      creado: new Date().toISOString().slice(0, 10)
    };
    return Object.assign(h, over || {});
  }

  /* ---- Personas ---------------------------------------------------------
     rol: "nino" | "adulto" | "equipo"
     "equipo" son quienes operan la pantalla (no se les planifica dieta).    */
  function nuevaPersona(p) {
    p = p || {};
    return {
      id: p.id || ("p" + Math.random().toString(36).slice(2, 7)),
      inicial: (p.inicial || "?").slice(0, 2).toUpperCase(),
      color: p.color || PALETA[0],
      rol: p.rol || "adulto",
      alias: p.alias || null,             // nombre de pila para pantalla, sin apellido
      nacimiento: p.nacimiento || null,   // YYYY-MM-DD, sólo si rol === "nino"
      pauta: p.pauta || null,             // id de la pauta dietaria que aplica
      modulos: p.modulos || null          // null = derivar de la edad
    };
  }

  /* ---- Edad -------------------------------------------------------------- */
  function edadMeses(persona, hoy) {
    if (!persona || !persona.nacimiento) return null;
    var n = new Date(persona.nacimiento + "T12:00:00");
    var d = hoy ? new Date(hoy + "T12:00:00") : new Date();
    if (isNaN(n.getTime())) return null;
    var m = (d.getFullYear() - n.getFullYear()) * 12 + (d.getMonth() - n.getMonth());
    if (d.getDate() < n.getDate()) m--;
    return m < 0 ? null : m;
  }

  function edadTexto(persona, hoy) {
    var m = edadMeses(persona, hoy);
    if (m == null) return "";
    if (m < 24) return m + "m";
    var a = Math.floor(m / 12);
    return a + "a" + (m % 12 ? " " + (m % 12) + "m" : "");
  }

  /* ---- Módulos que corresponden por edad -------------------------------- */
  function modulosSugeridos(meses) {
    var out = [];
    Object.keys(MODULOS).forEach(function (k) {
      var m = MODULOS[k];
      if (m.siempre) { out.push(k); return; }
      if (meses == null) return;
      if (m.edadMin != null && meses < m.edadMin) return;
      if (m.edadMax != null && meses > m.edadMax) return;
      out.push(k);
    });
    return out;
  }

  /* Unión de los módulos que necesita la casa completa. */
  function modulosDelHogar(h, hoy) {
    var set = {};
    modulosSugeridos(null).forEach(function (k) { set[k] = true; });
    (h.personas || []).forEach(function (p) {
      if (p.rol !== "nino") return;
      (p.modulos || modulosSugeridos(edadMeses(p, hoy))).forEach(function (k) { set[k] = true; });
    });
    return Object.keys(set);
  }

  function moduloActivo(h, id, hoy) {
    if (h.modulos && h.modulos[id] === false) return false;   // apagado a mano
    return modulosDelHogar(h, hoy).indexOf(id) !== -1;
  }

  /* ---- Validación --------------------------------------------------------
     Devuelve { ok, errores[], avisos[] }. Los errores rompen la app; los
     avisos son cosas que conviene mirar pero no detienen nada.              */
  function validar(h) {
    var errores = [], avisos = [];
    var PROHIBIDOS = ["nombre", "apellido", "rut", "dni", "direccion", "telefono", "email"];
    /* `alias` sí está permitido: en la cocina de una casa el nombre de pila
       es lo natural. Lo que no entra es el apellido, que es lo que convierte
       un nombre en una identidad rastreable. */

    if (!h || typeof h !== "object") return { ok: false, errores: ["hogar inexistente"], avisos: [] };
    if (!Array.isArray(h.personas) || !h.personas.length) errores.push("el hogar no tiene integrantes");

    var ids = {}, colores = {};
    (h.personas || []).forEach(function (p, i) {
      var quien = "persona #" + (i + 1);
      if (!p.id) errores.push(quien + ": sin id");
      if (ids[p.id]) errores.push("id repetido: " + p.id);
      ids[p.id] = true;

      PROHIBIDOS.forEach(function (campo) {
        if (p[campo]) errores.push(quien + ": el campo «" + campo + "» no va en este esquema");
      });

      if (p.rol === "nino" && !p.nacimiento) avisos.push(quien + ": sin fecha de nacimiento, no se pueden derivar módulos por edad");
      if (p.nacimiento && edadMeses(p) == null) errores.push(quien + ": fecha de nacimiento inválida");
      if (colores[p.color]) avisos.push("color repetido entre " + colores[p.color] + " y " + p.id);
      colores[p.color] = p.id;
      if (p.rol === "nino" && !p.pauta) avisos.push(quien + ": sin pauta dietaria asignada");
      if (p.alias && /\s/.test(p.alias.trim())) errores.push(quien + ": el alias debe ser sólo el nombre de pila");
    });

    var orden = ["desayuno", "media_manana", "almuerzo", "media_tarde", "cena", "dormir"];
    var prev = -1;
    orden.forEach(function (a) {
      var v = h.anclas && h.anclas[a];
      if (!v || !/^\d{2}:\d{2}$/.test(v)) { errores.push("ancla «" + a + "» inválida"); return; }
      var min = Number(v.slice(0, 2)) * 60 + Number(v.slice(3));
      if (min <= prev) avisos.push("«" + a + "» no va después de la comida anterior");
      prev = min;
    });

    var t = h.tandas || {};
    if (t.vidaUtilDias && t.repetirTrasDias && t.repetirTrasDias > t.vidaUtilDias)
      errores.push("un plato no puede esperar más días para repetirse de los que dura");

    return { ok: !errores.length, errores: errores, avisos: avisos };
  }

  /* Rótulos de persona para toda la app. Una sola fuente: si el nombre se
     escribe en tres lugares distintos, tarde o temprano dos quedan viejos. */
  function etiquetas(h) {
    var out = {};
    (h.personas || []).forEach(function (p) { out[p.id] = p.alias || p.inicial; });
    out.adultos = "Adultos";
    out.todos = "Todos";
    return out;
  }

  function persona(h, id) {
    return (h.personas || []).filter(function (p) { return p.id === id; })[0] || null;
  }

  /* ---- Persistencia (usa store.js) -------------------------------------- */
  var CLAVE = "hogar";
  function cargar(S) {
    return S.get(CLAVE, null).then(function (h) { return h || null; });
  }
  function guardar(S, h) {
    var v = validar(h);
    if (!v.ok) return Promise.reject(new Error("hogar inválido: " + v.errores.join(" · ")));
    return S.set(CLAVE, h).then(function () { return h; });
  }

  var Hogar = {
    COMIDAS: COMIDAS, MODULOS: MODULOS, TANDAS: TANDAS, PALETA: PALETA,
    nuevo: nuevoHogar, nuevaPersona: nuevaPersona,
    edadMeses: edadMeses, edadTexto: edadTexto,
    modulosSugeridos: modulosSugeridos, modulosDelHogar: modulosDelHogar, moduloActivo: moduloActivo,
    etiquetas: etiquetas, persona: persona,
    validar: validar, cargar: cargar, guardar: guardar, CLAVE: CLAVE
  };

  root.Hogar = Hogar;
  if (typeof module !== "undefined" && module.exports) module.exports = Hogar;
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>

   REGLA DE LA CASA — se cocina una vez al día, en tanda
   ---------------------------------------------------------------------
   · El Banquete NUNCA es el mismo plato que el Il Pranzo del mismo día.
   · Por eso cada olla se hace FACTOR_TANDA veces la porción base: se come
     la mitad hoy al Il Pranzo y la otra mitad queda en el Polo Norte para el
     Banquete de otro día.
   · Con 3-4 días cocinando una vez al día hay repertorio suficiente para
     no repetir dentro de 2 días.
   · Vida útil: los platos NO son eternos. Ver VIDA_* abajo.

const PORCION_BASE  = 4;   // la mesa completa

   aparte. Más allá de estos días la tanda se congela o se descarta —

function prepararRecetas(){

    r.rinde = r.rinde || PORCION_BASE;
    r.tanda = r.rinde * FACTOR_TANDA;

       `cat` sigue siendo el principal, el que usa el ranking. */
    r.cats = (r.cats && r.cats.length) ? r.cats : (r.cat ? [r.cat] : []);

}

/* ================= STORAGE (sobre store.js) =================

/* S arranca en modo local para que la pantalla pinte de inmediato, y se
   reemplaza por Supabase apenas hay sesión. Los 56 sget/sset apuntan a S en
   el momento de llamarse, no antes: por eso esto funciona sin tocarlos.     */
let S = Store.create({ prefix:"", shared:true });

async function iniciarAlmacenamiento(){
  if(!globalThis.supabase || !globalThis.SupabaseDriver) return;

}

function avisarModo(detalle){

function pedirLlave(error){

  d.innerHTML =
    '<div style="font:800 1.5rem/1.2 system-ui;letter-spacing:.02em">CENTRAL DE LA CASA</div>'
  + '<div style="width:64px;height:5px;background:#F0A834;border-radius:3px;margin:14px 0 22px"></div>'
  + '<div style="max-width:420px;font-size:.95rem;line-height:1.5;color:#4a4f57">'
  + 'Este dispositivo todavía no está conectado.<br>Pega el link de la casa para vincularlo.</div>'
  + '<textarea id="cc-llave-txt" rows="4" placeholder="https://..." '
  + 'style="width:100%;max-width:420px;margin-top:18px;padding:12px;border:1.5px solid #d8d2c6;'
  + 'border-radius:10px;font:400 .82rem/1.4 ui-monospace,monospace;background:#fff;'
  + 'resize:vertical;-webkit-user-select:text;user-select:text"></textarea>'
  + '<div id="cc-llave-err" style="min-height:20px;margin-top:8px;font-size:.85rem;color:#8c3a2a">'
  + (error || "") + '</div>'
  + '<button id="cc-llave-ok" style="margin-top:6px;padding:13px 30px;border:0;border-radius:10px;'
  + 'background:#1C2026;color:#FAF7F0;font:700 .95rem system-ui;cursor:pointer">Conectar</button>'
  + '<div style="margin-top:20px;font-size:.78rem;color:#8a8578;max-width:380px;line-height:1.5">'
  + 'Se pide una sola vez por dispositivo. La llave queda guardada acá y nunca '
  + 'se envía a ningún servidor fuera de la base de la casa.</div>';
  document.body.appendChild(d);

  d.querySelector("#cc-llave-ok").addEventListener("click", async () => {
    const txt = (d.querySelector("#cc-llave-txt").value || "").trim();
    const err = d.querySelector("#cc-llave-err");
    const i = txt.indexOf("#");
    if(i < 0) return err.textContent = "Ese link no trae la llave (le falta el # y lo que sigue).";
    const q = new URLSearchParams(txt.slice(i + 1));
    const cred = { url:q.get("u"), key:q.get("k"), email:q.get("e"), pass:q.get("p") };
    if(!cred.url || !cred.key || !cred.email || !cred.pass)
      return err.textContent = "Al link le falta alguno de los cuatro datos.";
    err.textContent = "Conectando…";
    try{
      localStorage.setItem("cc:cred", JSON.stringify(cred));
      await iniciarAlmacenamiento();
      if(MODO !== "nube") throw new Error("no se pudo entrar");
      d.remove();
      await loadShared();
    }catch(e){
      try{ localStorage.removeItem("cc:cred"); }catch(e2){}
      err.textContent = "No se pudo conectar. Revisa correo y contraseña. (" + (e.message||e) + ")";
    }
  });
}

/* =====================================================================
   ESTA CASA — única fuente sobre quién vive acá
   Los nombres estaban escritos tres veces (NINOS, QUIEN_LBL, QUIENES).
   Ahora salen todos de acá. Sin apellidos, sin RUT: el esquema no tiene

   Las fechas de nacimiento encienden solos los módulos que corresponden
   por edad, y los apagan cuando dejan de corresponder.
   ===================================================================== */
const HOGAR = Hogar.nuevo({

  personas: [
    Hogar.nuevaPersona({id:"J", inicial:"J", alias:"Juli\u00e1n", rol:"nino",

    Hogar.nuevaPersona({id:"D", inicial:"D", alias:"Domingo", rol:"nino",
                        color:Hogar.PALETA[1], nacimiento:"2022-10-07", pauta:"general"})
  ]
});
const ETIQ = Hogar.etiquetas(HOGAR);

/* =====================================================================
   MÓDULO DE HISTORIAL — append-only, prefijo "hist:"
   hist:index             → filas livianas para listar
   hist:receta:{id}       → receta médica completa (+ imagen si se carga)
   hist:tratamiento:{id}  → derivado de cada ítem de receta
   hist:compra:{id}       → compra (total + lista)
   hist:menu:{semana}     → snapshot del menú aprobado
   hist:adherencia:{f}    → dosis del día archivadas antes del reset
   hist:valoracion:{id}   → cada estrella que alguien toca (v3)
   Regla: nada se borra. Las correcciones entran como entrada nueva
   con campo `corrige` apuntando a la anterior.
   ===================================================================== */
const HIST = (() => {
  const NINOS = Object.fromEntries(HOGAR.personas.filter(p=>p.rol==="nino")
                  .map(p=>[p.id,{nombre:ETIQ[p.id], color:p.color}])
                  .concat([["Dm",{nombre:"— demo —"}]]));
  const QUIEN_LBL = ETIQ;
  const uid = p => p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,6);

  /* Copia en memoria del índice. Sin esto, dos escrituras seguidas leen
     ambas la versión vieja y la segunda borra a la primera. */
  let _idx = null;
  async function getIndex(){
    if(_idx) return _idx;
    _idx = (await sget("hist:index")) || [];
    return _idx;
  }

  async function _push(tipo, obj, resumen){
    const fila = { id:obj.id, tipo, fecha:obj.fecha, ninoId:obj.ninoId||null,
      resumen, corrige:obj.corrige||null, ts:Date.now() };
    await sset("hist:"+tipo+":"+obj.id, obj);   // el objeto va aparte: nunca choca

    /* El índice sí lo tocan varios dispositivos a la vez (el iPad de la cocina
       queda siempre abierto). Si escribiéramos nuestra copia en memoria,
       borraríamos lo que anotó el otro. Se relee y se fusiona por id. */
    const remoto = (await sget("hist:index")) || [];
    const vistos = new Set(remoto.map(r=>r.id));
    const propios = (_idx || []).filter(r => !vistos.has(r.id));
    _idx = [fila, ...propios, ...remoto].sort((a,b)=>(b.ts||0)-(a.ts||0));
    await sset("hist:index", _idx);
    return obj.id;
  }

  const api = {
    NINOS,
    async addReceta({fecha, ninoId, medico, items=[], imagen=null, corrige=null}){
      const rec = { id:uid("rec"), tipo:"receta", fecha:fecha||TODAY_KEY,
        ninoId, medico:medico||null, items, imagen, corrige, creado:TODAY_KEY };
      const nom = NINOS[ninoId] ? NINOS[ninoId].nombre : "—";
      const id = await _push("receta", rec, "Receta · "+nom+" · "+items.length+" ítem(s)");
      for(const it of items){
        await api.addTratamiento({ recetaId:id, ninoId,
          principioActivo:it.principioActivo, nombreComercial:it.nombreComercial,
          forma:it.forma, dosis:it.dosis, via:it.via, frecuencia:it.frecuencia,
          sos:!!it.sos, nota:it.nota||null,
          inicio:it.inicio||fecha||TODAY_KEY, fin:it.fin||null });
      }
      return id;
    },
    async addTratamiento(t){
      const tr = { id:uid("tra"), tipo:"tratamiento", recetaId:t.recetaId||null,
        ninoId:t.ninoId, principioActivo:t.principioActivo||null,
        nombreComercial:t.nombreComercial||null, forma:t.forma||null,
        dosis:t.dosis||null, via:t.via||null, frecuencia:t.frecuencia||null,
        sos:!!t.sos, nota:t.nota||null,
        inicio:t.inicio||TODAY_KEY, fin:t.fin||null,
        estado:"activo", fecha:t.inicio||TODAY_KEY, corrige:t.corrige||null };
      const nom = NINOS[tr.ninoId] ? NINOS[tr.ninoId].nombre : "—";
      return _push("tratamiento", tr,
        (tr.nombreComercial||tr.principioActivo)+" · "+nom+" · "+(tr.sos?"SOS":(tr.frecuencia||"")));
    },
    async addCompra({fecha, origen="Jumbo", total=null, items=[], semana=null}){
      const c = { id:uid("cmp"), tipo:"compra", fecha:fecha||TODAY_KEY,
        origen, total, items, semana, ninoId:null };
      const t = (total!=null && total!=="") ? " · $"+Number(total).toLocaleString("es-CL") : "";
      return _push("compra", c, origen+" · "+items.length+" ítems"+t);
    },
    async addMenu({semana, dias=[], listaCompra=[]}){
      const m = { id:"menu_"+semana, tipo:"menu", fecha:semana, semana, dias, listaCompra, ninoId:null };
      return _push("menu", m, "Menú semana "+semana+" · "+dias.length+" días");
    },
    /* v3 — cada estrella que alguien toca queda registrada. Append-only:
       si vuelven a valorar el mismo plato, entra un registro nuevo, no se pisa. */
    async addValoracion(v){
      const val = { id:uid("val"), tipo:"valoracion", fecha:v.fecha||TODAY_KEY,
        recetaId:v.recetaId, titulo:v.titulo||null, categoria:v.categoria||null,
        fuente:v.fuente||null, estrellas:v.estrellas, quien:v.quien||"todos",
        ninoId:(v.quien==="J"||v.quien==="D")?v.quien:null, nota:v.nota||null };
      return _push("valoracion", val,
        (val.titulo||"Receta")+" · "+val.estrellas+"★ · "+(QUIEN_LBL[val.quien]||val.quien));
    },
    async archivarAdherencia(fecha, dosis){
      if(!dosis || !Object.keys(dosis).length) return null;
      if(await sget("hist:adherencia:adh_"+fecha)) return null;   // idempotente
      const a = { id:"adh_"+fecha, tipo:"adherencia", fecha, checks:dosis, ninoId:null };
      return _push("adherencia", a, "Adherencia "+fecha+" · "+Object.keys(dosis).length+" tratamiento(s)");
    },
    async lista({tipo=null, ninoId=null}={}){
      let idx = await getIndex();
      if(tipo) idx = idx.filter(e=>e.tipo===tipo);
      if(ninoId) idx = idx.filter(e=>e.ninoId===ninoId);
      return idx;
    },
    async abrir(tipo,id){ return sget("hist:"+tipo+":"+id); },
    _reset(){ _idx = null; },
    async _todosTratamientos(ninoId){
      const idx = (await getIndex()).filter(e=>e.tipo==="tratamiento");
      const out=[];
      for(const r of idx){
        const t = await sget("hist:tratamiento:"+r.id);
        if(!t) continue;
        if(ninoId && t.ninoId!==ninoId) continue;
        out.push(t);
      }
      return out;
    },
    /* Vigentes HOY: derivados por fecha. No se guardan aparte — así el panel
       nunca queda mostrando un remedio que ya terminó. */
    async activos(ninoId=null){
      const hoy = TODAY_KEY;
      return (await api._todosTratamientos(ninoId)).filter(t=>{
        const empezo  = !t.inicio || t.inicio <= hoy;
        const vigente = !t.fin    || t.fin    >= hoy;
        return empezo && vigente && t.estado==="activo";
      });
    },
    async terminados(ninoId=null){
      const hoy = TODAY_KEY;
      return (await api._todosTratamientos(ninoId)).filter(t=> t.fin && t.fin < hoy);
    },
    /* Mismo principio activo vigente más de una vez → riesgo de doble dosis */
    async duplicados(ninoId=null){
      const act = await api.activos(ninoId);
      const por = {};
      act.forEach(t=>{
        const k=(t.principioActivo||"").toLowerCase().trim();
        if(!k) return; (por[k]=por[k]||[]).push(t);
      });
      return Object.entries(por).filter(([,a])=>a.length>1)
        .map(([pa,arr])=>({principioActivo:pa, tratamientos:arr}));
    },
    dupsEnItems(items=[]){
      const por={};
      items.forEach(it=>{
        const k=(it.principioActivo||"").toLowerCase().trim();
        if(!k) return; (por[k]=por[k]||[]).push(it);
      });
      return Object.entries(por).filter(([,a])=>a.length>1)
        .map(([pa,arr])=>({principioActivo:pa, items:arr}));
    },
    async exportar(){
      const idx = await getIndex();
      const dump = { generado:new Date().toISOString(), index:idx, entradas:{} };
      for(const r of idx) dump.entradas[r.tipo+":"+r.id] = await sget("hist:"+r.tipo+":"+r.id);
      dump.valoraciones = { agregados: await sget("rate:agg"), vetadas: await sget("rate:veto") };
      return dump;
    },
    /* Archiva las dosis del día anterior antes de que se reseteen. Idempotente. */
    async migrarDosisSiCorresponde(todayKey, dosisHoy){
      try{
        const last = await sget("hist:_ultimoDia");
        if(last && last.fecha && last.fecha!==todayKey && last.dosis)
          await api.archivarAdherencia(last.fecha, last.dosis);
        sset("hist:_ultimoDia", {fecha:todayKey, dosis:dosisHoy||{}});
      }catch(e){}
    },
  };
  return api;
})();

/* =====================================================================
   MÓDULO DE VALORACIÓN (v3) — prefijo "rate:"
   ---------------------------------------------------------------------
   Tres reglas de diseño, no son detalle de implementación:

   1. El ranking ordena DENTRO de una categoría, nunca ENTRE categorías.
      La pauta decide cuántas legumbres van por semana. El ranking decide
      CUÁL legumbre. Nunca decide SI va legumbre. Si un plato de legumbre
      puntúa mal, candidatos() busca otra legumbre — no cambia a pasta.

   2. Una receta necesita MIN_N registros para que su promedio cuente.
      Bajo eso queda "en prueba" y se sigue proponiendo. Un rechazo aislado
      de un plato nuevo no retira nada: aceptar un sabor nuevo toma varias
      exposiciones, y retirar al primer 1★ le achica el repertorio a Julián
      justo cuando hay que ampliarlo.

   3. Nada se borra. Sacar un plato de circulación es un acto manual, con
      motivo escrito, y reversible.

   La estrella evalúa LA RECETA, no al niño. El copy respeta eso.
   ===================================================================== */
const RATE = (() => {
  const MIN_N = 3;             // registros mínimos para que el promedio cuente
  const EXPOSICIONES = 8;      // por debajo, el plato sigue "en rodaje"
  const REINTENTO_DIAS = 21;   // cuánto esperar antes de reofrecer algo flojo
  const K_AGG = "rate:agg", K_VETO = "rate:veto";

  const CATS = {
    legumbre:{label:"Legumbres",        porSemana:3},
    cereal:  {label:"Arroz / pasta",    porSemana:2},
    guiso:   {label:"Guiso tradicional",porSemana:1},
    pescado: {label:"Pescado",          porSemana:2},
    ave:     {label:"Pollo / pavo",     porSemana:2},
  };
  const QUIENES = ETIQ;

  const fila = () => ({ n:0, suma:0, veces:0, porQuien:{}, ultima:null,
                        ultimaEstrella:null, cat:null, titulo:null, fuente:null });

  /* Lectura sincrónica desde state.rateAgg — render() es sincrónico. */
  function stats(recetaId){
    const f = state.rateAgg[recetaId] || fila();
    const prom = f.n ? f.suma/f.n : null;
    const porQuien = {};
    Object.keys(f.porQuien||{}).forEach(k=>{
      const x=f.porQuien[k];
      porQuien[k] = { n:x.n, prom: x.n ? Math.round((x.suma/x.n)*10)/10 : null };
    });
    return { n:f.n, veces:f.veces,
      prom: prom===null ? null : Math.round(prom*10)/10,
      confiable: f.n >= MIN_N,
      enRodaje:  f.veces < EXPOSICIONES,
      ultima:f.ultima, ultimaEstrella:f.ultimaEstrella,
      porQuien, cat:f.cat, titulo:f.titulo, fuente:f.fuente,
      vetada: !!state.rateVeto[recetaId] };
  }

  /* `corrige` = {estrellas, quien} del registro provisional del mismo almuerzo.
     El ledger del historial es append-only y conserva ambos; el agregado
     descuenta el provisional para no contar dos veces la misma comida. */
  async function registrar(recetaId, estrellas, quien, meta, corrige){
    meta = meta || RECETAS[recetaId] || {};
    const e = Math.max(0, Math.min(5, Math.round(Number(estrellas))));
    const q = QUIENES[quien] ? quien : "todos";

    await HIST.addValoracion({ recetaId, estrellas:e, quien:q,
      titulo:meta.name||meta.titulo||null, categoria:meta.cat||null, fuente:meta.fuente||null,
      nota: corrige ? "Precisa el registro anterior del mismo almuerzo." : null });

    const f = state.rateAgg[recetaId] || fila();
    if(corrige && corrige.estrellas!=null){
      f.n = Math.max(0, f.n - 1);
      f.suma = Math.max(0, f.suma - corrige.estrellas);
      const pk = corrige.quien || "todos";
      const p = f.porQuien[pk];
      if(p){
        p.n = Math.max(0, p.n - 1);
        p.suma = Math.max(0, p.suma - corrige.estrellas);
        if(p.n === 0) delete f.porQuien[pk];
      }
    }
    f.n += 1; f.suma += e;
    f.ultima = TODAY_KEY; f.ultimaEstrella = e;
    if(meta.cat)    f.cat = meta.cat;
    if(meta.name)   f.titulo = meta.name;
    if(meta.fuente) f.fuente = meta.fuente;
    const pq = f.porQuien[q] || {n:0,suma:0};
    pq.n += 1; pq.suma += e;
    f.porQuien[q] = pq;
    state.rateAgg[recetaId] = f;
    await guardarAgg();
    return stats(recetaId);
  }

  /* Cuenta que el plato se ofreció, aunque nadie lo valore. */
  function ofrecida(recetaId, meta){
    meta = meta || RECETAS[recetaId] || {};
    const f = state.rateAgg[recetaId] || fila();
    f.veces += 1;
    if(meta.cat)    f.cat = meta.cat;
    if(meta.name)   f.titulo = meta.name;
    if(meta.fuente) f.fuente = meta.fuente;
    state.rateAgg[recetaId] = f;
    sset(K_AGG, state.rateAgg);
  }

  /* Ranking DENTRO de una categoría. Nunca mezcla categorías. */
  function ranking(cat){
    return Object.keys(state.rateAgg)
      .filter(id => state.rateAgg[id].cat === cat && !state.rateVeto[id])
      .map(id => Object.assign({id}, stats(id)))
      .sort((a,b)=>{
        if(a.confiable !== b.confiable) return a.confiable ? -1 : 1;
        return (b.prom||0) - (a.prom||0);
      });
  }

  /* ---- La restricción, escrita a mano ----------------------------------
     candidatos("legumbre", 3) devuelve 3 platos de legumbre ordenados por
     valoración. Nunca devuelve menos por estar mal valorados, y siempre
     reserva un cupo para algo poco probado. Si no alcanza, informa `falta`
     — eso significa "hay que sumar una legumbre nueva al repertorio",
     nunca "cambia de categoría".                                        */
  function candidatos(cat, cuantos){
    const n = cuantos || (CATS[cat] ? CATS[cat].porSemana : 1);
    const r = ranking(cat);
    const listos   = r.filter(x=>x.confiable);
    const enPrueba = r.filter(x=>!x.confiable);
    const disponibles = listos.filter(x =>
      x.prom >= 3 || x.enRodaje || !x.ultima || diasEntre(x.ultima, TODAY_KEY) >= REINTENTO_DIAS);

    const out = [];
    if(enPrueba.length && n > 1) out.push(enPrueba[0]);   // el repertorio tiene que crecer
    for(const x of disponibles){ if(out.length>=n) break; if(!out.find(y=>y.id===x.id)) out.push(x); }
    for(const x of r){          if(out.length>=n) break; if(!out.find(y=>y.id===x.id)) out.push(x); }

    return { categoria:cat, pedidos:n, entregados:out.length,
             falta:Math.max(0, n-out.length), lista:out };
  }

  function vetar(recetaId, motivo){
    state.rateVeto[recetaId] = { motivo:motivo||"sin motivo", fecha:TODAY_KEY };
    sset(K_VETO, state.rateVeto);
  }
  function desvetar(recetaId){
    delete state.rateVeto[recetaId];
    sset(K_VETO, state.rateVeto);
  }

  /* Al fusionar agregados nos quedamos con el que tiene más registros:
     es el que vio más comidas, así que es el más completo. */
  async function guardarAgg(){
    const remoto = (await sget(K_AGG)) || {};
    Object.keys(remoto).forEach(id=>{
      const mio = state.rateAgg[id], suyo = remoto[id];
      if(!mio || (suyo && (suyo.n||0) > (mio.n||0))) state.rateAgg[id] = suyo;
    });
    await sset(K_AGG, state.rateAgg);
  }

  return { MIN_N, EXPOSICIONES, REINTENTO_DIAS, CATS, QUIENES, guardarAgg,
           stats, registrar, ofrecida, ranking, candidatos, vetar, desvetar };
})();

/* =====================================================================
   EL POLO NORTE (v5) — prefijo "polo"
   ---------------------------------------------------------------------
   Se cocina UNA vez al día, en tanda doble. Lo que sobra queda acá y
   alimenta los Banquetes de los días siguientes.

   Regla dura, la que da sentido a todo: el Banquete NUNCA es el mismo
   plato que el Il Pranzo del mismo día. Está en sugerirBanquete().

   Regla blanda: tampoco se repite un plato servido en los últimos
   NO_REPETIR_EN días, si hay con qué reemplazarlo.

   Orden: se sirve primero lo que vence antes. Lo vencido no se ofrece.
   ===================================================================== */
const POLO = (() => {
  const K = "polo";
  const uid = () => "tnd_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,5);
  const masDias = (f,n)=>{ const d=new Date(f+"T12:00:00"); d.setDate(d.getDate()+n); return iso(d); };
  /* Qué se cocina un día cualquiera, según la plantilla semanal */
  const idxDe  = f => (new Date(f+"T12:00:00").getDay()+6)%7;
  const pranzoDe = f => MENU_SEMANAL[idxDe(f)] || null;

  async function guardar(){
    const remoto = (await sget(K)) || [];
    const mios = new Set(state.polo.map(b=>b.id));
    const otros = remoto.filter(b => b && b.id && !mios.has(b.id));
    if(otros.length) state.polo = [...state.polo, ...otros];
    await sset(K, state.polo);
  }

  /* Registra la tanda del día. Idempotente: una por receta y por fecha. */
  function cocinar(recetaId, fecha){
    const r = RECETAS[recetaId];
    if(!r) return null;
    const ya = state.polo.find(b=>b.recetaId===recetaId && b.cocinado===fecha);
    if(ya) return ya;
    const b = {
      id: uid(), recetaId, titulo:r.name, cat:r.cat||null,
      cocinado: fecha,
      porciones: r.tanda,
      restantes: Math.max(0, r.tanda - r.rinde),   // lo del Il Pranzo ya se comió
      vence: masDias(fecha, r.vidaPolo),
      vidaPolo: r.vidaPolo,
      congelado: false,
      servidoEn: [fecha],
    };
    state.polo.unshift(b);
    guardar();
    return b;
  }

  const vigentes = (fecha) => state.polo
    .filter(b => b.restantes > 0 && b.vence >= fecha)
    .sort((a,b)=> a.vence.localeCompare(b.vence));   // primero lo que vence antes

  const vencidas = (fecha) => state.polo.filter(b => b.restantes > 0 && b.vence < fecha);
  const porVencer = (fecha) => vigentes(fecha).filter(b => b.vence <= masDias(fecha,1));

  /* La elección del Banquete. Acá vive la regla. */
  function sugerirBanquete(fecha){
    const hoyPranzo = pranzoDe(fecha);
    const disp = vigentes(fecha).filter(b => b.recetaId !== hoyPranzo);   // ← regla dura
    if(!disp.length){
      return { tanda:null, motivo: state.polo.length
        ? "No hay nada en el Polo Norte que sirva hoy — lo que queda es el mismo plato del Il Pranzo o ya venció."
        : "El Polo Norte está vacía. En cuanto se cocine la primera tanda, el Banquete sale de acá." };
    }
    const frescos = disp.filter(b=>{
      const ult = (b.servidoEn||[]).slice(-1)[0];
      return !ult || diasEntre(ult, fecha) >= NO_REPETIR_EN;      // ← regla blanda
    });
    const elegida = (frescos.length ? frescos : disp)[0];
    return { tanda: elegida, relajada: !frescos.length };
  }

  function servir(tandaId, fecha, porciones){
    const b = state.polo.find(x=>x.id===tandaId);
    if(!b) return null;
    b.restantes = Math.max(0, b.restantes - (porciones||PORCION_BASE));
    b.servidoEn = (b.servidoEn||[]).concat([fecha]);
    guardar();
    return b;
  }

  function congelar(tandaId, fecha){
    const b = state.polo.find(x=>x.id===tandaId);
    if(!b) return null;
    b.congelado = true;
    b.vence = masDias(fecha, VIDA_CONGELADO);
    guardar();
    return b;
  }

  function descartar(tandaId){
    const b = state.polo.find(x=>x.id===tandaId);
    if(!b) return null;
    b.restantes = 0; b.descartado = TODAY_KEY;
    guardar();
    return b;
  }

  /* Cuántos platos DISTINTOS hay disponibles: mide si el repertorio de la
     Polo Norte alcanza para no repetir. */
  function variedad(fecha){
    return new Set(vigentes(fecha).map(b=>b.recetaId)).size;
  }

  /* ---- Proyección de la semana --------------------------------------
     Recorre de hoy al domingo descontando porciones a medida que se
     sirven, y sumando la olla de cada día al día siguiente. Devuelve el
     Banquete concreto de cada día, o null si ese día no da.
     Esto es lo que evita tener que adivinar qué está por vencer.       */
  function proyectar(){
    const stock = state.polo
      .filter(b=>b.restantes>0)
      .map(b=>({recetaId:b.recetaId, titulo:b.titulo, restantes:b.restantes,
                vence:b.vence, congelado:b.congelado}));
    const plan = {};
    for(let i=todayIdx; i<=6; i++){
      const fecha = iso(weekDates[i]);
      const pranzoId = MENU_SEMANAL[i];
      const disp = stock
        .filter(b=>b.restantes>0 && b.vence>=fecha && b.recetaId!==pranzoId)  // ← regla dura
        .sort((a,b)=> a.vence.localeCompare(b.vence));                        // ← primero lo que vence
      const el = disp[0] || null;
      plan[i] = el ? {
        titulo: el.titulo, recetaId: el.recetaId, congelado: !!el.congelado,
        vence: el.vence, urgente: diasEntre(fecha, el.vence) <= 1
      } : null;
      if(el) el.restantes -= PORCION_BASE;
      /* La olla de un día futuro recién queda libre al día siguiente */
      const r = RECETAS[pranzoId];
      if(i > todayIdx && r){
        stock.push({ recetaId:pranzoId, titulo:r.name, restantes:r.tanda - r.rinde,
          vence: masDias(fecha, r.vidaPolo), congelado:false });
      }
    }
    return plan;
  }

  /* Lo próximo que se echa a perder, para avisarlo sin que nadie pregunte */
  function proximoAVencer(fecha){
    const v = vigentes(fecha).filter(b=>!b.congelado);
    return v.length ? v[0] : null;
  }

  return { cocinar, vigentes, vencidas, porVencer, sugerirBanquete, proyectar,
           proximoAVencer, servir, congelar, descartar, variedad, pranzoDe, masDias };
})();

/* Rota por día del año: misma palabra en todos los dispositivos, sin sortear */
function palabraDelDia(fecha){
  const d = new Date(fecha+"T12:00:00");
  const dia = Math.floor((d - new Date(d.getFullYear(),0,0))/86400000);
  return PALABRAS[dia % PALABRAS.length];
}

   ===================================================================== */
const CLIMA_LUGAR = "Vitacura, Santiago de Chile";
const VENTANAS = ["08","11","14","17","20"];
const ICONOS = {

function iconoSVG(k){
  const d = ICONOS[k] || ICONOS.nubes_pocas;
  return `<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" aria-hidden="true">${d}</svg>`;
}

const MANANA_KEY = (()=>{const d=new Date(TODAY_KEY+"T12:00:00");d.setDate(d.getDate()+1);return iso(d);})();

/* El respaldo NO puede ser un pronóstico con fecha: caduca solo y la franja
   queda vacía. Es un perfil climático de Santiago por mes — sirve cualquier
   día del año. Se ve tenue y con un punto, para que no se confunda con el
   pronóstico real: es "así suele ser", no "así va a estar hoy". */
const CLIMA_TIPICO = [
  /* ene */ {min:12,max:30,icon:"sol"},          /* feb */ {min:11,max:29,icon:"sol"},
  /* mar */ {min:10,max:27,icon:"sol"},          /* abr */ {min: 8,max:23,icon:"nubes_pocas"},
  /* may */ {min: 6,max:18,icon:"nubes_muchas"}, /* jun */ {min: 4,max:15,icon:"lluvia_leve"},
  /* jul */ {min: 3,max:14,icon:"lluvia_leve"},  /* ago */ {min: 4,max:16,icon:"nubes_muchas"},
  /* sep */ {min: 6,max:19,icon:"nubes_pocas"},  /* oct */ {min: 8,max:23,icon:"nubes_pocas"},
  /* nov */ {min:10,max:26,icon:"sol"},          /* dic */ {min:11,max:29,icon:"sol"},
];
/* Curva del día: frío temprano, máximo a media tarde, bajando de noche. */
const CURVA = [0.05, 0.55, 1.0, 0.85, 0.35];

/* Pronóstico real consultado para estos días. Si coincide la fecha se usa
   este; si no, cae al perfil típico de arriba. Nunca queda vacío. */
const CLIMA_PRONOSTICO = {
  "2026-08-03":[{h:"08",icon:"nubes_muchas",t:11},{h:"11",icon:"nubes_muchas",t:14},
                {h:"14",icon:"nubes_muchas",t:17},{h:"17",icon:"nubes_muchas",t:15},
                {h:"20",icon:"nubes_muchas",t:12}],
  "2026-08-04":[{h:"08",icon:"nubes_muchas",t:11},{h:"11",icon:"nubes_pocas",t:13},
                {h:"14",icon:"nubes_pocas",t:16},{h:"17",icon:"nubes_pocas",t:14},
                {h:"20",icon:"nubes_muchas",t:12}],
  "2026-08-05":[{h:"08",icon:"nubes_pocas",t:7},{h:"11",icon:"sol",t:12},
                {h:"14",icon:"sol",t:16},{h:"17",icon:"nubes_pocas",t:14},
                {h:"20",icon:"nubes_pocas",t:9}],
};

function climaTipico(fecha){
  if(CLIMA_PRONOSTICO[fecha]) return CLIMA_PRONOSTICO[fecha];
  const m = Number(fecha.slice(5,7)) - 1;
  const t = CLIMA_TIPICO[m] || CLIMA_TIPICO[0];
  return VENTANAS.map((hh,i)=>({
    h: hh,
    icon: (i===0 || i===4) ? "nubes_muchas" : t.icon,
    t: Math.round(t.min + (t.max - t.min) * CURVA[i]),
    aprox: true,
  }));
}

async function cargarClima(pedirIA){
  const [c1,c2] = await Promise.all([sget("clima:"+TODAY_KEY), sget("clima:"+MANANA_KEY)]);
  state.clima = {
    hoy:    (c1 && c1.v) || climaTipico(TODAY_KEY),
    manana: (c2 && c2.v) || climaTipico(MANANA_KEY),
  };
  pintarClima();
  if(!pedirIA) return;
  if(c1 && c1.v && c2 && c2.v) return;
  try{
    const r = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-6", max_tokens:1000,
        tools:[{type:"web_search_20250305", name:"web_search"}],
        messages:[{role:"user", content:
          `Busca el pronóstico por hora en ${CLIMA_LUGAR} para hoy ${TODAY_KEY} y mañana ${MANANA_KEY}. `+
          `Responde SOLO un arreglo JSON, sin texto ni markdown, con 10 objetos: `+
          `5 para hoy y 5 para mañana, en las horas locales 08, 11, 14, 17 y 20, con esta forma: `+
          `[{"dia":"hoy","h":"08","icon":"sol","t":9},{"dia":"manana","h":"08","icon":"lluvia_leve","t":7}]. `+
          `El campo icon debe ser uno de: sol, nubes_pocas, nubes_muchas, lluvia_leve, lluvia_fuerte. `+
          `El campo t es la temperatura en grados Celsius, número entero.`}]
      })
    });
    const data = await r.json();
    const txt = (data.content||[]).filter(x=>x.type==="text").map(x=>x.text).join("\n");
    const limpio = txt.replace(/```json|```/g,"").trim();
    const arr = JSON.parse(limpio.slice(limpio.indexOf("["), limpio.lastIndexOf("]")+1));
    if(Array.isArray(arr) && arr.length){
      const hoy = arr.filter(x=>x.dia!=="manana").slice(0,5);
      const man = arr.filter(x=>x.dia==="manana").slice(0,5);
      if(hoy.length){ state.clima.hoy = hoy; sset("clima:"+TODAY_KEY, {v:hoy}); }
      if(man.length){ state.clima.manana = man; sset("clima:"+MANANA_KEY, {v:man}); }
      pintarClima();
    }
  }catch(e){ showToast("No pude actualizar el clima"); }
}

/* Dosis máximas por día a partir de "cada N h" */
function dosisPorDia(frec){
  if(!frec) return null;
  const m = String(frec).match(/cada\s+(\d+)\s*h/i);
  if(!m) return null;
  const h = Number(m[1]);
  if(!h || h<=0) return null;
  return Math.floor(24/h);
}

const PRODS = Object.fromEntries(CATALOGO.map(p=>[p.id,p]));

function normalizar(s){
  return String(s==null?"":s).toLowerCase().trim()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();
}
/* Texto libre → producto del catálogo. null si no reconoce nada. */
function resolverProducto(texto){
  const q = normalizar(texto);
  if(!q) return null;
  let mejor=null, score=0;
  for(const p of CATALOGO){
    for(const alias of p.a){
      const na = normalizar(alias);
      let s = 0;
      if(q===na) s=100;
      else if(q.startsWith(na+" ")||q.endsWith(" "+na)) s=80;
      else if(q.includes(na) && na.length>=4) s=60+na.length;
      else if(na.includes(q) && q.length>=4) s=40+q.length;
      if(s>score){ score=s; mejor=p; }
    }
  }
  return mejor ? {prod:mejor, exacto:score>=80} : null;
}
/* Producto asociado a un ítem de "falta algo" */
function prodDe(item){ return item && item.prodId ? PRODS[item.prodId] : null; }

/* Precio en pantalla. Un precio con fecha vieja o con rango ancho no puede
   mostrarse con la misma cara de certeza que uno estable: el limón varió
   135% en ocho meses. El "≈" es esa honestidad, en un carácter.            */
function precioTxt(p){
  if(!p || !p.p) return "";
  const viejo = p.pF && diasEntre(p.pF, TODAY_KEY) > 60;
  return (p.vol || viejo ? "\u2248 $" : "$") + p.p.toLocaleString("es-CL");
}

/* ---- Clima: ventana rodante de 5 tramos -----------------------------
   Siempre se ven 5. La ventana en curso se mantiene; las que ya pasaron
   se reemplazan por las de mañana, y una línea marca dónde cambia el día.
   A las 15:55: 14 (en curso) · 17 · 20 │ 08 · 11 de mañana.            */
function ventanasVisibles(){
  const hoy = (state.clima && state.clima.hoy) || null;
  if(!hoy) return null;
  const H = new Date().getHours();
  let cur = 0;
  VENTANAS.forEach((v,i)=>{ if(Number(v) <= H) cur = i; });
  if(H < Number(VENTANAS[0])) cur = 0;          // antes de las 8 va el día entero
  const deHoy = hoy.slice(cur);
  const faltan = 5 - deHoy.length;
  const man = (state.clima.manana || []).slice(0, Math.max(0,faltan));
  return { hoy:deHoy, manana:man };
}

function pintarClima(){
  const el = document.getElementById("clima");
  if(!el) return;
  const v = ventanasVisibles();
  if(!v){ el.innerHTML=""; return; }
  const casilla = (x,cls) => `<div class="cl-v ${cls||""} ${x.aprox?"cl-ap":""}">
      <div class="cl-h">${esc(x.h)}</div>
      <div class="cl-i">${iconoSVG(x.icon)}</div>
      <div class="cl-t">${x.t!=null?esc(String(Math.round(x.t)))+"°":"–"}</div>
    </div>`;
  el.innerHTML =
      v.hoy.map((x,i)=>casilla(x, i===0?"ahora":"")).join("")
    + (v.manana.length ? `<div class="cl-sep"><span>mañana</span></div>` : "")
    + v.manana.map(x=>casilla(x,"man")).join("");
}
