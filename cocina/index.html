/* Los eventos anotados a mano viven en una clave por fecha ("events:2026-07-30").
   Se cargan los siete días de la semana de una vez. */
async function cargarEventosSemana(){
  const fechas = weekDates.map(iso);
  const datos = await Promise.all(fechas.map(f=>sget("events:"+f)));
  const mapa = {};
  fechas.forEach((f,i)=>{ if(datos[i] && datos[i].length) mapa[f] = datos[i]; });
  return mapa;
}

/* Eventos de una fecha cualquiera: importados del calendario + anotados a mano */
function eventosDe(fecha){
  return [
    ...(state.agenda||[]).filter(e=>e.fecha===fecha)
        .map(e=>({time:e.hora||"—", text:e.titulo, src:"cal", fecha})),
    ...((state.events[fecha]||[]).map((e,x)=>({time:e.time, text:e.text, src:"casa", idx:x, fecha}))),
  ].sort((a,b)=>String(a.time).localeCompare(String(b.time)));
}
const eventosDeHoy = () => eventosDe(TODAY_KEY);

/* Guarda releyendo antes: el iPad y el computador anotan en la misma lista. */
async function guardarEventos(fecha){
  const lista = state.events[fecha] || [];
  const remoto = (await sget("events:"+fecha)) || [];
  const mios = new Set(lista.map(e=>e.id).filter(Boolean));
  const otros = remoto.filter(e => e && e.id && !mios.has(e.id));
  state.events[fecha] = [...lista, ...otros]
    .sort((a,b)=>String(a.time).localeCompare(String(b.time)));
  await sset("events:"+fecha, state.events[fecha]);
}

/* Bloque de eventos para cualquier columna de la pizarra */
function bloqueEventos(fecha, compacto){
  const evs = eventosDe(fecha);
  const tope = compacto ? 2 : 3;
  if(!evs.length){
    return `<button class="col-evts" data-action="abrir-dia" data-fecha="${fecha}">
      <span class="cev none">— sin eventos</span>
      ${compacto?"":'<span class="evt-mas">tocar para agregar</span>'}
    </button>`;
  }
  return `<button class="col-evts" data-action="abrir-dia" data-fecha="${fecha}">
    ${evs.slice(0,tope).map(e=>`<span class="cev"><span class="t">${esc(e.time)}</span><span>${esc(e.text)}</span></span>`).join("")}
    ${evs.length>tope ? `<span class="evt-mas">+${evs.length-tope} más</span>` : (compacto?"":'<span class="evt-mas">tocar para editar</span>')}
  </button>`;
}

/* ---- Pestaña Ranking (sólo lectura) ---- */
function renderRanking(){
  const cats = Object.keys(RATE.CATS);
  let body = "";
  cats.forEach(c=>{
    const cat = RATE.CATS[c];
    const r = RATE.ranking(c);
    const cand = RATE.candidatos(c);
    body += `<div class="rt-catsec">${cat.label} · ${cat.porSemana} por semana según la pauta</div>`;
    if(!r.length){
      body += `<div class="empty">Sin platos registrados en esta categoría todavía.</div>`;
      return;
    }
    body += r.map(x=>`<div class="rt-rank">
        <span class="p">${x.confiable ? x.prom+"★" : "—"}</span>
        <span class="nm">${esc(x.titulo||x.id)}
          <small>${x.confiable ? x.n+" registros" : "en prueba · "+x.n+"/"+RATE.MIN_N}${x.fuente?" · "+esc(x.fuente):""}</small>
        </span>
        <button class="rt-chip" data-action="rate-veto" data-id="${x.id}">${x.vetada?"Reactivar":"No repetir"}</button>
      </div>`).join("");
    if(cand.falta>0){
      body += `<div class="rt-hist" style="color:var(--due)"><b>Falta ${cand.falta} plato(s) de ${cat.label.toLowerCase()}</b> para cubrir la semana. Hay que sumar recetas nuevas a esta categoría — no reemplazarla por otra.</div>`;
    }
  });

  main.innerHTML = `
    <div class="hist-head">
      <p class="note"><b>Qué funciona y qué no.</b> Las estrellas ordenan los platos <b>dentro</b> de cada categoría, nunca entre categorías: la pauta de la nutricionista decide cuántas legumbres van por semana, el ranking decide cuál legumbre. Un plato necesita ${RATE.MIN_N} registros antes de que su promedio cuente — con menos queda «en prueba» y sigue apareciendo, porque aceptar un sabor nuevo toma varias veces.</p>
    </div>
    <div class="rt-nota">Si un plato queda flojo no desaparece: vuelve a proponerse después de ${RATE.REINTENTO_DIAS} días. «No repetir» lo saca de circulación a mano, y se puede reactivar cuando quieran.</div>
    <div class="panel">${body}</div>`;
}

function renderCompras(){
  const baseRows = PEDIDO_BASE.map(([n,q])=>{
    const got=!!state.shopGot[n];
    return `<button class="item ${got?"got":""}" data-action="toggle-base" data-name="${esc(n)}">
      <span class="box">${got?"✓":""}</span><span class="iname">${esc(n)}</span>
      <span class="qty">${q}</span><span class="otag menu">menú</span>
    </button>`;
  }).join("");
  const extraRows = state.falta.length
    ? state.falta.map((i,x)=>{
        const p = prodDe(i);
        return `<button class="item ${i.got?"got":""}" data-action="toggle-extra" data-idx="${x}">
          <span class="box">${i.got?"✓":""}</span>
          <span class="iname">${p?esc(p.n):esc(i.name)}
            ${p?`<span class="isub">pedido como «${esc(i.name)}»${p.alt&&PRODS[p.alt]?" · si no hay: "+esc(PRODS[p.alt].n.slice(0,30)):""}</span>`
               :`<span class="isub libre">sin producto habitual</span>`}
          </span>
          ${p?`<span class="qty">${precioTxt(p)}</span>`:""}
          <span class="otag casa">casa</span>
        </button>`;
      }).join("")
    : '<div class="hint" style="padding:0 18px 14px">Nada aún — se agrega desde «Falta algo».</div>';

  const est = totalEstimado();
  const estTxt = est.conocidos
    ? `≈ $${est.total.toLocaleString("es-CL")} en lo anotado por la casa${est.desconocidos?` · ${est.desconocidos} sin precio conocido`:""}`
    : "";

  main.innerHTML=`<div class="shop">
    <div class="shop-top">
      <span class="big">${shopCount()} por comprar</span>
      <span class="note">Lista consolidada del menú semanal según la pauta de Julián (sin sal agregada, sin margarina, sin caldos ni procesados) + lo anotado por la casa, ya traducido a los productos y marcas que ustedes compran.${estTxt?`<br><b>${estTxt}</b>`:""}</span>
    </div>
    <div class="glabel">Agregado por la casa</div>
    ${extraRows}
    <div class="glabel">Para el menú de la semana</div>
    ${baseRows}
    <div class="shop-actions">
      <button class="cerrar" data-action="cerrar-pedido">Cerrar pedido y guardar</button>
      <span class="nota">Al cerrar, la lista y el menú de la semana quedan registrados en Historial. Sirve para comparar semanas y recordar marcas.</span>
    </div>
  </div>`;
}

/* ---- Pestaña Historial (sólo lectura) ---- */
function renderHistorial(){
  const TIPOS=[["","Todo"],["receta","Recetas"],["tratamiento","Remedios"],
    ["compra","Compras"],["menu","Menús"],["valoracion","Valoraciones"],["adherencia","Adherencia"]];
  const chips = TIPOS.map(([v,l])=>
    `<button class="hfilter ${(state.histFiltro||"")===v?"on":""}" data-action="hist-tipo" data-val="${v}">${l}</button>`).join("")
    + `<button class="hfilter export" data-action="hist-export">⬇︎ Exportar JSON</button>`;

  const rows = state.histFiltro
    ? state.histRows.filter(r=>r.tipo===state.histFiltro)
    : state.histRows;

  const list = rows.length
    ? rows.map(r=>`<button class="hrow" data-action="hist-open" data-tipo="${r.tipo}" data-id="${r.id}">
        <span class="htag t-${r.tipo}">${r.tipo}</span>
        <span class="hres">${esc(r.resumen)}</span>
        <span class="hfecha">${esc(r.fecha)}</span>
      </button>`).join("")
    : `<div class="hist-empty">Nada registrado todavía en esta categoría.<br>Las recetas entran desde el chat de Claude; las compras, al cerrar un pedido.</div>`;

  main.innerHTML = `
    <div class="hist-head">
      <p class="note"><b>Registro completo de la casa.</b> Recetas médicas, tratamientos, compras, menús, valoraciones y adherencia diaria. Nada se borra: las correcciones entran como registro nuevo. Esta pantalla es <b>sólo de mirar</b> — la carga pasa por el chat de Claude.</p>
    </div>
    <div class="hist-filters">${chips}</div>
    ${list}`;
}

async function openHist(tipo,id){
  const o = await HIST.abrir(tipo,id);
  if(!o){ showToast("No encontrado"); return; }
  let titulo = "Registro", body = "";

  if(tipo==="receta"){
    titulo = "Receta · "+esc(o.fecha);
    const dups = HIST.dupsEnItems(o.items||[]);
    if(dups.length){
      body += `<div class="salt"><b>Doble presentación del mismo principio activo:</b> ${dups.map(d=>esc(d.principioActivo)).join(", ")}. Es una <b>o</b> la otra, nunca las dos juntas.</div>`;
    }
    if(o.medico) body += `<div class="slabel">Prescrito por</div><p>${esc(o.medico)}</p>`;
    body += `<div class="slabel">Indicaciones</div>` + (o.items||[]).map(it=>`
      <div class="ing">
        <span class="iname">${esc(it.nombreComercial||it.principioActivo)}
          <span style="display:block;font-weight:400;font-size:.8rem;color:var(--ink-soft)">${esc(it.dosis||"")}${it.frecuencia?" · "+esc(it.frecuencia):""}${it.sos?" · sólo si hace falta":""}${it.nota?"<br>"+esc(it.nota):""}</span>
        </span>
        <span class="iqty">${esc(it.fin||"")}</span>
      </div>`).join("");
    if(o.imagen) body += `<div class="slabel">Foto original</div><img src="${o.imagen}" alt="receta" style="max-width:100%;border-radius:12px">`;
  }
  else if(tipo==="tratamiento"){
    titulo = esc(o.nombreComercial||o.principioActivo);
    const venc = o.fin && o.fin < TODAY_KEY;
    body = `<div class="m-meta">
        <span class="pill tag">${esc(o.sos?"sólo si hace falta":(o.frecuencia||""))}</span>
        <span class="pill ${venc?"":"ok"}" style="${venc?"color:var(--ink-soft)":""}">${venc?"terminado":"vigente"}</span>
      </div>
      <div class="slabel">Detalle</div>
      <p style="line-height:1.7">${esc(o.dosis||"")} · ${esc(o.via||"")}<br>
      ${esc(o.forma||"")}<br>
      Desde ${esc(o.inicio||"")} hasta ${esc(o.fin||"sin término")}</p>
      ${o.nota?`<div class="salt">${esc(o.nota)}</div>`:""}`;
  }
  else if(tipo==="compra"){
    titulo = esc(o.origen||"Compra")+" · "+esc(o.fecha);
    if(o.total!=null && o.total!=="") body += `<div class="m-meta"><span class="pill ok">Total $${Number(o.total).toLocaleString("es-CL")}</span></div>`;
    body += `<div class="slabel">${(o.items||[]).length} productos</div>` +
      (o.items||[]).map(x=>`<div class="ing"><span class="iname">${esc(x)}</span></div>`).join("");
  }
  else if(tipo==="menu"){
    titulo = "Menú · semana "+esc(o.semana);
    body = `<div class="slabel">Almuerzos</div>` +
      (o.dias||[]).map((d,i)=>`<div class="ing"><span class="iqty">${DIAS[i]||""}</span><span class="iname">${esc(d)}</span></div>`).join("");
  }
  else if(tipo==="valoracion"){
    titulo = esc(o.titulo||"Valoración");
    body = `<div class="m-meta">
        <span class="pill tag">${o.estrellas}★</span>
        <span class="pill" style="color:var(--ink-soft)">${esc(RATE.QUIENES[o.quien]||o.quien)}</span>
        ${o.categoria?`<span class="pill ok">${esc(o.categoria)}</span>`:""}
      </div>
      ${o.fuente?`<div class="rt-f" style="margin-top:10px">Fuente: ${esc(o.fuente)}</div>`:""}
      <div class="slabel">Registrado</div><p>${esc(o.fecha)}</p>
      ${o.nota?`<div class="rt-hist">${esc(o.nota)}</div>`:""}`;
  }
  else if(tipo==="adherencia"){
    titulo = "Adherencia · "+esc(o.fecha);
    const ks = Object.keys(o.checks||{});
    body = `<div class="slabel">Dosis registradas</div>` +
      (ks.length ? ks.map(k=>`<div class="ing"><span class="iname">${esc(k)}</span><span class="iqty">${esc(o.checks[k])}</span></div>`).join("")
                 : "<p>Sin dosis ese día.</p>");
  }

  modal.innerHTML = `<div class="m-top"><h3>${titulo}</h3><button class="close" data-action="close">✕</button></div>${body}`;
  overlay.classList.add("open");
}

function openCerrarPedido(){
  const items = listaCompraFinal();
  modal.innerHTML = `
    <div class="m-top"><h3>Cerrar pedido</h3><button class="close" data-action="close">✕</button></div>
    <p style="line-height:1.6;margin-top:14px">Se van a guardar en el historial <b>${items.length} productos</b> y el menú de esta semana. Queda como registro para comparar con semanas anteriores.</p>
    <label class="fld"><span>Total del pedido (opcional)</span>
      <input id="tot-input" type="number" inputmode="numeric" placeholder="ej: 48990"></label>
    <button class="mbtn" data-action="confirmar-pedido">Guardar en historial</button>
  `;
  overlay.classList.add("open");
}

async function confirmarPedido(){
  const el = $("#tot-input");
  const total = el && el.value.trim() ? Number(el.value.trim()) : null;
  const items = listaCompraFinal();
  await HIST.addCompra({ fecha:TODAY_KEY, origen:"Jumbo", total, items, semana:WEEK_KEY });
  await HIST.addMenu({ semana:WEEK_KEY, dias:MENU_SEMANAL.map(id=>RECETAS[id].name), listaCompra:items });
  await refrescarHistorial();
  overlay.classList.remove("open");
  showToast("Pedido guardado en historial ✓");
  render();
}

async function exportarHistorial(){
  const dump = await HIST.exportar();
  const blob = new Blob([JSON.stringify(dump,null,2)],{type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download="central-historial-"+TODAY_KEY+".json";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast("Historial exportado");
}

function festejar(){
  const viejo = document.getElementById("rex-wrap");
  if(viejo) viejo.remove();
  const chispas = Array.from({length:14},(_,i)=>
    `<span class="rex-sp" style="--a:${i*25.7}deg;--d:${i*0.04}s">★</span>`).join("");
  const w = document.createElement("div");
  w.className="rex-wrap"; w.id="rex-wrap"; w.setAttribute("aria-hidden","true");
  w.innerHTML = `<div class="rex-stage">
    <div class="rex-burst">${chispas}</div>
    <img class="rex-img" src="${REX_IMG}" alt="">
    <div class="rex-msg">¡CINCO ESTRELLAS!</div>
  </div>`;
  document.body.appendChild(w);
  setTimeout(()=>{ const x=document.getElementById("rex-wrap"); if(x) x.remove(); }, 3200);
}

/* =====================================================================
   MENÚ Y RECETARIO — editables desde la app, sin pasar por el chat
   ---------------------------------------------------------------------
   recetario           → recetas propias (se suman a las de fábrica)
   menu:{semana}       → qué se cocina cada día de esa semana
   El menú es por semana: cambiar el de esta no toca el de la próxima, y
   el histórico queda tal como se cocinó.
   ===================================================================== */
async function cargarRecetario(){
  const propias = (await sget("recetario")) || {};
  RECETAS = Object.assign({}, RECETAS_BASE, propias);
  prepararRecetas();
  const m = await sget("menu:"+WEEK_KEY);
  MENU_SEMANAL = (Array.isArray(m) && m.length===7 && m.every(id=>RECETAS[id]))
    ? m : MENU_POR_DEFECTO.slice();
}

async function guardarMenu(){
  await sset("menu:"+WEEK_KEY, MENU_SEMANAL);
}

async function guardarReceta(id, receta){
  const propias = (await sget("recetario")) || {};
  propias[id] = receta;
  await sset("recetario", propias);
  RECETAS[id] = receta;
  prepararRecetas();
}

async function borrarReceta(id){
  const propias = (await sget("recetario")) || {};
  delete propias[id];
  await sset("recetario", propias);
  RECETAS = Object.assign({}, RECETAS_BASE, propias);
  prepararRecetas();
}

/* Cuenta cuántos días de la semana toca cada categoría, para contrastarlo
   con lo que pide la nutricionista. Es el control del Ritual: la app no
   impide guardar un menú fuera de pauta, pero lo muestra en rojo. */
function conteoCategorias(menu){
  const c = {};
  Object.keys(RATE.CATS).forEach(k=>{ c[k] = 0; });
  (menu||MENU_SEMANAL).forEach(id=>{
    const r = RECETAS[id];
    if(!r) return;
    (r.cats || [r.cat]).forEach(k=>{ if(c[k] !== undefined) c[k]++; });
  });
  return c;
}
function pautaOk(menu){
  const c = conteoCategorias(menu);
  return Object.keys(RATE.CATS).every(k => c[k] === RATE.CATS[k].porSemana);
}

/* ================= MUTACIONES ================= */
/* Guarda una lista releyendo antes, para no borrar lo que anotó el otro. */
async function guardarFalta(){
  const remoto = (await sget("falta")) || [];
  const mios = new Set(state.falta.map(i=>i.id).filter(Boolean));
  const otros = remoto.filter(i => i && i.id && !mios.has(i.id));
  state.falta = [...state.falta, ...otros];
  await sset("falta", state.falta);
}

function addFalta(name){
  if(!name||!name.trim())return;
  const txt = name.trim();
  const r = resolverProducto(txt);
  state.falta.unshift({ id:"f_"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
                        name:txt, prodId: r ? r.prod.id : null, got:false });
  guardarFalta();
  showToast(r ? "«"+txt+"» → "+r.prod.n.slice(0,34)+" ✓" : "«"+txt+"» anotado ✓");
  render();
}

function cambiarDosis(id, delta){
  const t = state.vigentes.find(x=>x.id===id);
  const actual = state.meds[id] || 0;
  const nuevo = Math.max(0, actual + delta);
  state.meds[id] = nuevo;
  sset("meds:"+TODAY_KEY, state.meds);
  sset("hist:_ultimoDia", {fecha:TODAY_KEY, dosis:state.meds});
  if(t && delta>0){
    const max = dosisPorDia(t.frecuencia);
    if(max && nuevo>max) showToast("⚠️ Pasaste el máximo diario de "+(t.nombreComercial||t.principioActivo));
    // Aviso de doble principio activo
    const gemelo = state.vigentes.find(x=>x.id!==t.id &&
      (x.principioActivo||"").toLowerCase()===(t.principioActivo||"").toLowerCase());
    if(gemelo && (state.meds[gemelo.id]||0)>0){
      showToast("⚠️ Ya se dio "+(gemelo.nombreComercial||gemelo.principioActivo)+" — mismo principio activo");
    }
  }
  render();
}

/* Devuelve el registro que hay que corregir si ya se valoró este mismo
   almuerzo en esta sesión. Evita que un plato sume varios registros por
   una sola comida — si no, MIN_N se alcanzaría con la mitad de las veces. */
function registroProvisional(recetaId){
  return (state.rateSel && state.rateSel.recetaId === recetaId)
    ? { estrellas: state.rateSel.estrellas, quien: state.rateSel.quien || "todos" }
    : null;
}

/* Primer toque: la estrella. Se guarda de inmediato como "todos", así no se
   pierde nada si nadie sigue tocando. */
async function valorar(recetaId, estrellas){
  const previo = registroProvisional(recetaId);
  await RATE.registrar(recetaId, estrellas, "todos", RECETAS[recetaId], previo);
  state.rateSel = { recetaId, estrellas:Number(estrellas), quien:null };
  await refrescarHistorial();
  if(Number(estrellas)===5) festejar();
  else showToast("Anotado: "+estrellas+"★");
  if(overlay.classList.contains("open")) openRecipe(recetaId);
  render();
}
/* Segundo toque, opcional: para quién. PRECISA el registro anterior — no suma
   una comida más. El historial conserva ambos; el promedio cuenta una. */
async function valorarQuien(recetaId, quien){
  if(!state.rateSel || state.rateSel.recetaId!==recetaId) return;
  const previo = registroProvisional(recetaId);
  await RATE.registrar(recetaId, state.rateSel.estrellas, quien, RECETAS[recetaId], previo);
  state.rateSel.quien = quien;
  await refrescarHistorial();
  showToast("Anotado para "+(RATE.QUIENES[quien]||quien));
  render();
}

/* ================= EVENTOS UI ================= */
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-action], .tab");
  if(!el){if(e.target===overlay)overlay.classList.remove("open");return;}
  if(el.classList.contains("tab")){state.view=el.dataset.view;render();return;}
  const a=el.dataset.action;

  if(a==="dose-plus")  return cambiarDosis(el.dataset.id, +1);
  if(a==="dose-minus") return cambiarDosis(el.dataset.id, -1);

  if(a==="rate-star")  return valorar(el.dataset.id, el.dataset.val);
  if(a==="rate-quien") return valorarQuien(el.dataset.id, el.dataset.quien);
  if(a==="rate-veto"){
    const id = el.dataset.id;
    if(state.rateVeto[id]){ RATE.desvetar(id); showToast("Vuelve a circulación"); }
    else { RATE.vetar(id, "marcado desde el ranking"); showToast("Fuera de circulación — reversible"); }
    return render();
  }

  if(a==="nev-servir"){
    POLO.servir(el.dataset.id, TODAY_KEY, PORCION_BASE);
    showToast("Servido · "+PORCION_BASE+" porciones");
    return render();
  }
  if(a==="nev-congelar"){
    POLO.congelar(el.dataset.id, TODAY_KEY);
    showToast("Congelado — la fecha se extiende");
    return render();
  }
  if(a==="importar-agenda"){
    const ta = $("#ag-input");
    try{
      const datos = JSON.parse(ta.value.trim());
      if(!Array.isArray(datos)) throw new Error("no es una lista");
      state.agenda = datos.filter(x=>x && x.fecha && x.titulo);
      sset("agenda:"+WEEK_KEY, state.agenda);
      showToast(state.agenda.length+" eventos importados ✓");
    }catch(err){
      showToast("No pude leer eso — revisa el formato");
    }
    render(); return openDia(state.diaAbierto);
  }
  if(a==="limpiar-agenda"){
    state.agenda = [];
    sset("agenda:"+WEEK_KEY, state.agenda);
    showToast("Agenda vaciada");
    render(); return openDia(state.diaAbierto);
  }

  if(a==="clima-actualizar"){
    showToast("Actualizando clima…");
    await cargarClima(true);
    return;
  }
  if(a==="ritual-cambiar"){
    MENU_SEMANAL[Number(el.dataset.idx)] = el.value;
    return render();
  }
  if(a==="ritual-guardar"){
    await guardarMenu();
    showToast(pautaOk() ? "Menú guardado ✓" : "Menú guardado — fuera de pauta");
    return render();
  }
  if(a==="ritual-restaurar"){
    MENU_SEMANAL = MENU_POR_DEFECTO.slice();
    await guardarMenu();
    showToast("Menú de fábrica restaurado");
    return render();
  }
  if(a==="rc-cupo"){ el.classList.toggle("rc-on"); return; }
  if(a==="ritual-nueva"){ openReceta(null); return; }
  if(a==="ritual-editar"){ openReceta(el.dataset.id); return; }
  if(a==="rc-guardar"){
    const nom = $("#rc-name").value.trim();
    if(!nom){ showToast("Falta el nombre del plato"); return; }
    const id = el.dataset.id || ("r_"+Date.now().toString(36)+Math.random().toString(36).slice(2,4));
    const lineas = s => s.split("\n").map(x=>x.trim()).filter(Boolean);
    const receta = {
      name: nom,
      cat: $("#rc-cat").value,
      cats: Array.from(document.querySelectorAll(".rc-cats .rc-on")).map(x=>x.dataset.k),
      fuente: $("#rc-fuente").value.trim() || "Receta de la casa",
      diff: 1, time: "—", tags: [],
      ings: lineas($("#rc-ings").value).map(l=>{
        const [n,q] = l.split("|"); return [ (n||"").trim(), (q||"").trim() ]; }),
      steps: lineas($("#rc-steps").value),
      julian: $("#rc-julian").value.trim() || "Sin sal ni caldos. Ver la pauta.",
    };
    await guardarReceta(id, receta);
    overlay.classList.remove("open");
    showToast("Receta guardada ✓");
    return render();
  }
  if(a==="rc-borrar"){
    const id = el.dataset.id;
    if(MENU_SEMANAL.includes(id)){ showToast("Está en el menú de esta semana — cámbiala primero"); return; }
    await borrarReceta(id);
    overlay.classList.remove("open");
    showToast("Sacada del recetario");
    return render();
  }
  if(a==="abrir-dia"){ openDia(el.dataset.fecha || TODAY_KEY); return; }
  if(a==="dia-nav"){ if(el.dataset.fecha) openDia(el.dataset.fecha); return; }
  if(a==="ver-terminados"){ state.verTerminados=!state.verTerminados; return render(); }
  if(a==="open-recipe")openRecipe(el.dataset.id);
  if(a==="close"){overlay.classList.remove("open");render();}
  if(a==="add-falta"){addFalta(el.dataset.name);el.disabled=true;}
  if(a==="add-falta-input"){const i=$("#falta-input");addFalta(i.value);i.value="";i.focus();}
  if(a==="toggle-base"){
    const n=el.dataset.name;
    state.shopGot[n]=!state.shopGot[n];
    sset("shopgot:"+WEEK_KEY, state.shopGot);
    render();
  }
  if(a==="toggle-extra"){
    state.falta[el.dataset.idx].got=!state.falta[el.dataset.idx].got;
    guardarFalta();
    render();
  }
  if(a==="del-falta"){
    state.falta.splice(el.dataset.idx,1);
    await sset("falta", state.falta);   // borrar sí pisa: es una acción explícita
    render();
  }
  if(a==="add-event"){
    const i=$("#evt-input");
    if(!i.value.trim())return;
    const f = el.dataset.fecha || state.diaAbierto || TODAY_KEY;
    const m=i.value.trim().match(/^(\d{1,2}[:.]\d{2})\s+(.+)$/);
    const ev = m ? {time:m[1].replace(".",":"), text:m[2]} : {time:"—", text:i.value.trim()};
    ev.id = "e_"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    state.events[f] = (state.events[f]||[]).concat([ev]);
    await guardarEventos(f);
    i.value="";
    render(); if(overlay.classList.contains("open")) openDia(f);
  }
  if(a==="del-event"){
    const f = el.dataset.fecha || state.diaAbierto || TODAY_KEY;
    (state.events[f]||[]).splice(Number(el.dataset.idx),1);
    await sset("events:"+f, state.events[f]||[]);
    render(); if(overlay.classList.contains("open")) openDia(f);
  }
  if(a==="focus-falta"){
    if(state.view!=="semana"){state.view="semana";render();}
    setTimeout(()=>{const i=$("#falta-input");i&&i.scrollIntoView({behavior:"smooth",block:"center"});i&&i.focus();},100);
  }
  if(a==="hist-tipo"){ state.histFiltro = el.dataset.val || null; render(); }
  if(a==="hist-open"){ openHist(el.dataset.tipo, el.dataset.id); }
  if(a==="hist-export"){ exportarHistorial(); }
  if(a==="cerrar-pedido"){ openCerrarPedido(); }
  if(a==="confirmar-pedido"){ confirmarPedido(); }
});
/* Los <select> no disparan "click" al elegir una opción: van por "change". */
document.addEventListener("change", async e=>{
  const el = e.target.closest("[data-action]");
  if(!el) return;
  if(el.dataset.action==="ritual-cambiar"){
    MENU_SEMANAL[Number(el.dataset.idx)] = el.value;
    render();
  }
});

document.addEventListener("keydown",e=>{
  if(e.key==="Escape")overlay.classList.remove("open");
  if(e.key==="Enter"&&document.activeElement&&document.activeElement.id==="falta-input"){addFalta(document.activeElement.value);document.activeElement.value="";}
});

render();
iniciarAlmacenamiento().then(async () => {
  /* Las recetas base se publican a la base la primera vez. Así Control las
     lee de un solo lugar en vez de tener su propia copia — el mismo problema
     que teníamos con los nombres escritos en tres partes. */
  try{ if(!(await sget("recetas:base"))) await sset("recetas:base", RECETAS_BASE); }catch(e){}
  await loadShared();
});

/* Service worker: al abrir el ícono se busca la versión publicada. Se acabó
   el "no sé si estoy usando la última". */
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("../sw.js", { scope:"../" }).catch(()=>{});
}
</script>
