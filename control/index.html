<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Control">
<meta name="theme-color" content="#1C2026">
<title>Control de la Casa</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../apple-touch-icon-control.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--crema:#FAF7F0;--tinta:#1C2026;--ambar:#F0A834;--linea:#e2ddd2;--gris:#8a8578;--azul:#4a6d8c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--crema);color:var(--tinta);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:10;background:var(--tinta);color:var(--crema);
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
.h1{font-weight:800;letter-spacing:.06em;font-size:.92rem}
#estado{font-size:.72rem;letter-spacing:.04em;margin-top:3px;display:block}
#estado.ok{color:#7fc4a0} #estado.mal{color:#e0a08a}
nav{display:flex;background:var(--tinta);padding:0 8px}
.tab{flex:1;background:none;border:0;color:#9a958a;font:700 .82rem system-ui;
  padding:11px 4px 13px;border-bottom:2.5px solid transparent;position:relative}
.tab.on{color:var(--crema);border-bottom-color:var(--ambar)}
#badge-falta{position:absolute;top:5px;right:14px;background:var(--ambar);color:var(--tinta);
  font-size:.62rem;font-weight:800;border-radius:9px;padding:1px 5px;min-width:15px}
main{padding:14px 14px 96px}
.lista{display:flex;flex-direction:column;gap:9px}
.fila{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:11px 13px;
  display:flex;align-items:center;gap:11px}
.fila.hoy{border-color:var(--ambar);border-width:2px;background:#fffdf6}
.dia{min-width:74px;line-height:1.25}
.dia b{display:block;font-size:.86rem}
.dia span{font-size:.7rem;color:var(--gris);letter-spacing:.03em}
.sel{flex:1;min-width:0;font:600 .9rem system-ui;padding:9px 8px;border:1px solid var(--linea);
  border-radius:9px;background:var(--crema);color:var(--tinta);appearance:none}
.porc{font-size:.68rem;font-weight:700;color:#3d6b52;background:#e6f2ea;
  border-radius:7px;padding:3px 6px;white-space:nowrap}
.txt{flex:1;font-weight:600;font-size:.92rem;line-height:1.3}
.txt .sub{display:block;font-weight:400;font-size:.72rem;color:var(--gris);margin-top:2px}
.x{border:0;background:none;color:var(--gris);font-size:1.05rem;padding:6px 4px}
.vacio{text-align:center;color:var(--gris);padding:34px 10px;font-size:.9rem}
.agregar{margin-top:16px;display:flex;gap:8px}
.agregar.col{flex-direction:column}
.agregar .par{display:flex;gap:8px}
.agregar input{flex:1;min-width:0;padding:12px;border:1px solid var(--linea);border-radius:10px;
  font:400 .92rem system-ui;background:#fff}
.agregar button{padding:12px 18px;border:0;border-radius:10px;background:var(--tinta);
  color:var(--crema);font:700 .88rem system-ui;white-space:nowrap}
.nota{color:var(--gris);font-size:.78rem;line-height:1.5;margin:18px 2px 0}
#barra-guardar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px
  calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--crema) 34%);
  transform:translateY(120%);transition:transform .22s;z-index:20}
#barra-guardar.on{transform:none}
#guardar{width:100%;padding:15px;border:0;border-radius:12px;background:var(--ambar);
  color:var(--tinta);font:800 .96rem system-ui}
#toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,26px);opacity:0;
  background:var(--tinta);color:var(--crema);padding:10px 16px;border-radius:10px;
  font:600 .82rem system-ui;transition:.22s;pointer-events:none;z-index:30;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* Propuesta editable: cada día en dos pisos, el desplegable respira */
.prop .fila{flex-direction:column;align-items:stretch;gap:7px;padding:10px 12px}
.prop .fila .dia{min-width:0;font-size:.78rem;letter-spacing:.06em;color:#6c7078}
.prop .fila .sel{width:100%;font-size:.95rem;padding:11px 10px;background:#fff}
#llave{position:fixed;inset:0;z-index:999;background:var(--crema);display:flex;
  align-items:center;justify-content:center;padding:26px}
.lv-caja{max-width:420px;width:100%;text-align:center}
.lv-t{font-weight:800;font-size:1.4rem;letter-spacing:.03em}
.lv-ln{width:62px;height:5px;background:var(--ambar);border-radius:3px;margin:13px auto 20px}
.lv-caja p{color:#4a4f57;font-size:.93rem;line-height:1.5}
#lv-txt{width:100%;margin-top:14px;padding:12px;border:1.5px solid var(--linea);border-radius:10px;
  font:400 .8rem/1.4 ui-monospace,monospace;background:#fff;resize:vertical}
#lv-err{min-height:20px;margin-top:7px;font-size:.84rem;color:#8c3a2a}
#lv-ok{padding:13px 30px;border:0;border-radius:10px;background:var(--tinta);color:var(--crema);
  font:700 .93rem system-ui}
.lv-caja small{display:block;margin-top:18px;font-size:.76rem;color:var(--gris);line-height:1.5}

.pauta{margin-top:16px;background:#fff;border:1px solid var(--linea);border-radius:12px;padding:13px}
.pt{font:800 .68rem system-ui;letter-spacing:.09em;color:var(--gris)}
.pcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.pc{font-size:.7rem;font-weight:600;border-radius:8px;padding:4px 8px;background:#f2efe8;color:#5c5850}
.pc b{font-weight:800}
.pc.ok{background:#e6f2ea;color:#2f6347}
.pc.mal{background:#fbe6e0;color:#8c3a2a}
.pc.warn{background:#fdf0dc;color:#8a6014}
.pv{margin:11px 0 0;padding-left:17px;font-size:.79rem;line-height:1.55}
.pv li.e{color:#8c3a2a;font-weight:600}
.pv li.a{color:var(--gris)}
.pok{margin-top:10px;font-size:.8rem;font-weight:700;color:#2f6347}

.tarjeta{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:14px;margin-bottom:12px}
.tarjeta.off{opacity:.62}
.tarjeta.prop{border:2px solid var(--ambar);background:#fffdf6}
.tt{font:800 .68rem system-ui;letter-spacing:.09em;color:var(--gris);margin-bottom:9px}
.dias{display:flex;flex-direction:column;gap:5px}
.dias.toca{cursor:pointer}
.d{display:flex;gap:10px;align-items:baseline;padding:3px 2px;border-radius:7px}
.d.hoy{background:#fdf3dd}
.d span{font:700 .66rem system-ui;letter-spacing:.05em;color:var(--gris);min-width:30px}
.d b{font-size:.86rem;font-weight:700;line-height:1.3}
.razon{margin-top:10px;font-size:.82rem;line-height:1.5;color:#5c5850;font-style:italic}
.botones{display:flex;gap:8px;margin-top:13px}
.primario{flex:1;padding:13px;border:0;border-radius:11px;background:var(--ambar);color:var(--tinta);font:800 .9rem system-ui}
.secundario{padding:13px 16px;border:1px solid var(--linea);border-radius:11px;background:#fff;color:var(--gris);font:700 .88rem system-ui}
.accion{width:100%;padding:16px;border:0;border-radius:14px;background:var(--tinta);color:var(--crema);
  font:800 .96rem system-ui;margin-bottom:12px}
.accion[disabled]{opacity:.55}
.enlace{width:100%;padding:13px;border:0;background:none;color:var(--azul);font:700 .88rem system-ui;text-align:center}
.flist{display:flex;flex-direction:column;gap:7px;margin-top:11px}
.fitem{display:flex;align-items:center;gap:9px;background:var(--crema);border-radius:10px;padding:9px 11px}
.mini{font-size:.76rem;color:var(--gris);line-height:1.5;margin-top:9px}
#atras{border:0;background:none;color:var(--crema);font:700 .85rem system-ui;padding:4px 0;margin-bottom:2px}
.build{font-size:.62rem;color:#6a6f77;letter-spacing:.06em;margin-left:8px}
</style>
</head>
<body>
<header>
  <button id="atras" style="display:none">← Volver</button>
  <div class="h1">CONTROL DE LA CASA</div>
  <span id="estado" class="mal">○ conectando…</span>
  <span class="build">v3.1 · 10 ago</span>
</header>
<main id="app"><div class="vacio">Cargando…</div></main>
<div id="barra-guardar"><button id="guardar">Guardar el menú de la semana</button></div>
<div id="toast"></div>
<script>/* ============================================================================
   store.js · Capa de persistencia de Central de la Casa
   ----------------------------------------------------------------------------
   Por qué existe: hoy la app llama a `window.storage` directo, repartido por
   todo el archivo. Eso amarra la app al sistema de artifacts de Claude. Esta
   capa deja UNA sola puerta de salida. El día que haya que migrar a Supabase,
   Firebase o lo que sea, se escribe un driver nuevo y no se toca nada más.

   Además arregla tres cosas molestas del storage crudo:
     · `get` de una clave inexistente LANZA excepción → acá devuelve el default
     · todo es string → acá se serializa/deserializa JSON solo
     · cada lectura es un viaje de red → acá hay caché en memoria

   Uso:
     const S = Store.create({ prefix:"cc:", shared:true });
     await S.ready();
     const falta = await S.get("falta", []);
     await S.set("falta", [...falta, item]);
   ========================================================================== */
(function (root) {
  "use strict";
console.log("Control de la Casa · v3.1 · 10 ago");

  /* ---- Reglas de clave del storage subyacente -----------------------------
     Sin espacios, sin / \ ' " y bajo 200 caracteres. Normalizamos en vez de
     fallar: si alguien escribe "menu semana", queda "menu_semana".          */
  var MAX_KEY = 190;
  function sanitizarClave(k) {
    var s = String(k == null ? "" : k).trim()
      .replace(/[\s]+/g, "_")
      .replace(/[\/\\'"]/g, "-");
    if (!s) throw new Error("store: clave vacía");
    if (s.length > MAX_KEY) s = s.slice(0, MAX_KEY);
    return s;
  }

  /* ---- Driver A: window.storage (producción, dentro del artifact) -------- */
  function driverArtifact() {
    var api = root.storage;
    return {
      nombre: "artifact",
      disponible: !!(api && api.get && api.set),
      get: function (k, shared) {
        return api.get(k, shared).then(function (r) {
          return r ? r.value : null;
        }).catch(function () { return null; });   // clave inexistente → null
      },
      set: function (k, v, shared) { return api.set(k, v, shared); },
      del: function (k, shared) { return api.delete(k, shared); },
      list: function (p, shared) {
        return api.list(p, shared).then(function (r) {
          return r && r.keys ? r.keys : [];
        }).catch(function () { return []; });
      }
    };
  }

  /* ---- Driver B: memoria (tests en node, y dev abriendo el HTML local) --- */
  function driverMemoria(seed) {
    var m = Object.assign({}, seed || {});
    return {
      nombre: "memoria",
      disponible: true,
      get: function (k) { return Promise.resolve(k in m ? m[k] : null); },
      set: function (k, v) { m[k] = v; return Promise.resolve({ key: k, value: v }); },
      del: function (k) { delete m[k]; return Promise.resolve({ key: k, deleted: true }); },
      list: function (p) {
        return Promise.resolve(Object.keys(m).filter(function (k) {
          return !p || k.indexOf(p) === 0;
        }));
      },
      _dump: function () { return m; }
    };
  }

  /* ====================================================================== */
  function create(opts) {
    opts = opts || {};
    var prefix = opts.prefix || "cc:";
    var shared = opts.shared !== false;          // por defecto compartido
    var driver = opts.driver || (driverArtifact().disponible
      ? driverArtifact()
      : driverMemoria(opts.seed));

    var cache = Object.create(null);   // clave completa → valor decodificado
    var oyentes = [];
    var estado = { conectado: driver.nombre === "artifact", ultimoError: null };

    function full(k) { return prefix + sanitizarClave(k); }

    function decodificar(raw, fallback) {
      if (raw == null) return fallback;
      if (typeof raw !== "string") return raw;
      try { return JSON.parse(raw); } catch (e) { return raw; }
    }

    function avisar(tipo, clave, valor) {
      for (var i = 0; i < oyentes.length; i++) {
        try { oyentes[i]({ tipo: tipo, clave: clave, valor: valor, estado: estado }); }
        catch (e) { /* un oyente roto no puede voltear la escritura */ }
      }
    }

    var API = {
      driver: driver.nombre,
      estado: estado,

      /* Lectura. NUNCA lanza: si algo falla devuelve el fallback y marca el
         estado como desconectado, para que la UI pueda mostrarlo.           */
      get: function (k, fallback) {
        var fk = full(k);
        if (fk in cache) return Promise.resolve(cache[fk]);
        return driver.get(fk, shared).then(function (raw) {
          var v = decodificar(raw, fallback === undefined ? null : fallback);
          cache[fk] = v;
          estado.conectado = true;
          return v;
        }).catch(function (e) {
          estado.conectado = false; estado.ultimoError = String(e);
          return fallback === undefined ? null : fallback;
        });
      },

      /* Escritura write-through: la caché se actualiza al toque para que la
         UI responda, y si el backend falla se avisa sin perder el valor.     */
      set: function (k, valor) {
        var fk = full(k);
        cache[fk] = valor;
        avisar("set", k, valor);
        var raw = typeof valor === "string" ? valor : JSON.stringify(valor);
        return driver.set(fk, raw, shared).then(function (r) {
          estado.conectado = true; estado.ultimoError = null;
          avisar("sync", k, valor);
          return r;
        }).catch(function (e) {
          estado.conectado = false; estado.ultimoError = String(e);
          avisar("error", k, valor);
          return null;
        });
      },

      del: function (k) {
        var fk = full(k);
        delete cache[fk];
        avisar("del", k, null);
        return driver.del(fk, shared).catch(function () { return null; });
      },

      /* Claves bajo un sub-prefijo, ya sin el prefijo global.
         keys("hist:") → ["hist:2026-08-01", ...]                            */
      keys: function (sub) {
        return driver.list(prefix + (sub || ""), shared).then(function (ks) {
          return ks.map(function (k) { return k.slice(prefix.length); });
        });
      },

      /* Trae todo un sub-árbol en un objeto. Útil para el historial.         */
      getAll: function (sub) {
        return API.keys(sub).then(function (ks) {
          return Promise.all(ks.map(function (k) {
            return API.get(k).then(function (v) { return [k, v]; });
          }));
        }).then(function (pares) {
          var out = {};
          pares.forEach(function (p) { out[p[0]] = p[1]; });
          return out;
        });
      },

      /* Lee-modifica-escribe atómico a nivel de esta pestaña. Evita el bug
         clásico de dos paneles pisándose el mismo array.                     */
      update: function (k, fn, fallback) {
        return API.get(k, fallback).then(function (v) {
          return API.set(k, fn(v));
        });
      },

      /* Escribe varias claves de una. El storage es rate-limited, así que
         conviene agrupar lo que cambia junto en una sola clave — pero cuando
         de verdad son claves distintas, esto al menos las manda en paralelo. */
      setMany: function (obj) {
        return Promise.all(Object.keys(obj).map(function (k) {
          return API.set(k, obj[k]);
        }));
      },

      /* Suscripción para el indicador de "sincronizado" del header.          */
      on: function (fn) {
        oyentes.push(fn);
        return function () { oyentes = oyentes.filter(function (o) { return o !== fn; }); };
      },

      /* Migraciones versionadas. Se corre una vez por versión y queda
         registrado, así se puede cambiar el formato de los datos guardados
         sin romperle la app a la cocina.                                     */
      migrar: function (version, fn) {
        return API.get("_schema", 0).then(function (v) {
          if (v >= version) return false;
          return Promise.resolve(fn(API)).then(function () {
            return API.set("_schema", version);
          }).then(function () { return true; });
        });
      },

      /* Respaldo completo. Es la red de seguridad ante republicar el artifact,
         que estrena storage vacío.                                           */
      exportar: function () {
        return API.getAll("").then(function (todo) {
          return JSON.stringify({
            app: "central-de-la-casa",
            exportado: new Date().toISOString(),
            datos: todo
          }, null, 2);
        });
      },
      importar: function (json) {
        var d = typeof json === "string" ? JSON.parse(json) : json;
        var datos = d && d.datos ? d.datos : d;
        return API.setMany(datos).then(function () { return Object.keys(datos).length; });
      },

      _limpiarCache: function () { cache = Object.create(null); },
      ready: function () { return API.get("_schema", 0).then(function () { return API; }); }
    };

    return API;
  }

  var Store = { create: create, driverMemoria: driverMemoria, sanitizarClave: sanitizarClave };

  root.Store = Store;
  if (typeof module !== "undefined" && module.exports) module.exports = Store;
})(typeof globalThis !== "undefined" ? globalThis : this);

/* ============================================================================
   store-supabase.js · El driver que saca los datos de adentro de la app
   ----------------------------------------------------------------------------
   Esto es el pago del paso 6. store.js dejó una sola puerta al almacenamiento;
   acá se cambia lo que hay al otro lado de la puerta y la app no se entera.
   Ni un solo sget/sset del archivo principal cambia.

   Tres cosas que el storage del artifact no podía dar:
     · los datos sobreviven a publicar una versión nueva
     · la tablet se entera sola cuando editas desde el teléfono (tiempo real)
     · si se cae internet, la app sigue andando con lo último que vio

   Uso:
     const S = Store.create({ driver: await SupabaseDriver({ url, key, hogarId }) });
   ========================================================================== */
(function (root) {
  "use strict";

  var CACHE_LOCAL = "cc:cache:";     // espejo en el dispositivo, para modo avión

  function leerLocal(k) {
    try { var v = localStorage.getItem(CACHE_LOCAL + k); return v === null ? null : v; }
    catch (e) { return null; }
  }
  function escribirLocal(k, v) {
    try { v === null ? localStorage.removeItem(CACHE_LOCAL + k)
                     : localStorage.setItem(CACHE_LOCAL + k, v); }
    catch (e) { /* cuota llena: el espejo es un lujo, no puede voltear nada */ }
  }

  /* La llave y el hogar viajan en el fragmento del link (#...), que nunca sale
     del dispositivo ni queda en el repositorio. Primera visita: se lee y se
     guarda. De ahí en adelante el ícono entra solo.                          */
  function credenciales() {
    var f = (location.hash || "").replace(/^#/, "");
    if (f) {
      var p = new URLSearchParams(f), c = {
        url: p.get("u"), key: p.get("k"), email: p.get("e"), pass: p.get("p")
      };
      if (c.url && c.key && c.email && c.pass) {
        try { localStorage.setItem("cc:cred", JSON.stringify(c)); } catch (e) {}
        history.replaceState(null, "", location.pathname + location.search);
        return c;
      }
    }
    try { return JSON.parse(localStorage.getItem("cc:cred") || "null"); }
    catch (e) { return null; }
  }

  async function SupabaseDriver(opts) {
    opts = opts || {};
    var cred = opts.cred || credenciales();
    if (!cred) throw new Error("SIN_CREDENCIALES");

    var sb = root.supabase.createClient(cred.url, cred.key, {
      auth: { persistSession: true, autoRefreshToken: true }
    });

    var ses = await sb.auth.getSession();
    if (!ses.data.session) {
      var r = await sb.auth.signInWithPassword({ email: cred.email, password: cred.pass });
      if (r.error) throw new Error("LOGIN_FALLIDO: " + r.error.message);
    }

    var m = await sb.from("miembros").select("hogar_id").single();
    if (m.error || !m.data) throw new Error("SIN_HOGAR");
    var hogarId = m.data.hogar_id;

    var enVivo = [];

    /* Tiempo real: cualquier cambio en la base llega acá y se avisa hacia
       arriba, para que la pantalla se redibuje sola.                        */
    sb.channel("kv-" + hogarId)
      .on("postgres_changes",
          { event: "*", schema: "public", table: "kv", filter: "hogar_id=eq." + hogarId },
          function (p) {
            var fila = p.new || p.old;
            if (!fila) return;
            var val = p.eventType === "DELETE" ? null : JSON.stringify(fila.v);
            escribirLocal(fila.k, val);
            enVivo.forEach(function (fn) {
              try { fn(fila.k, val, p.eventType); } catch (e) {}
            });
          })
      .subscribe();

    return {
      nombre: "supabase",
      disponible: true,
      hogarId: hogarId,

      /* Devuelve string, igual que el driver viejo: store.js se encarga del
         JSON. Si la red falla, cae al espejo local en vez de morir.          */
      get: async function (k) {
        try {
          var r = await sb.from("kv").select("v").eq("hogar_id", hogarId).eq("k", k).maybeSingle();
          if (r.error) throw r.error;
          var s = r.data ? JSON.stringify(r.data.v) : null;
          escribirLocal(k, s);
          return s;
        } catch (e) { return leerLocal(k); }
      },

      set: async function (k, raw) {
        var v; try { v = JSON.parse(raw); } catch (e) { v = raw; }
        escribirLocal(k, raw);
        var r = await sb.from("kv").upsert({ hogar_id: hogarId, k: k, v: v },
                                           { onConflict: "hogar_id,k" });
        if (r.error) throw r.error;
        return { key: k, value: raw };
      },

      del: async function (k) {
        escribirLocal(k, null);
        var r = await sb.from("kv").delete().eq("hogar_id", hogarId).eq("k", k);
        if (r.error) throw r.error;
        return { key: k, deleted: true };
      },

      list: async function (prefijo) {
        try {
          var q = sb.from("kv").select("k").eq("hogar_id", hogarId);
          if (prefijo) q = q.like("k", prefijo + "%");
          var r = await q;
          if (r.error) throw r.error;

<script>/* ============================================================================
   pauta.js · Motor de reglas dietarias
   ----------------------------------------------------------------------------
   Hoy la app tiene pautaOk(), que devuelve true o false. Eso sirve para pintar
   un semáforo y para nada más: si dice que no, hay que adivinar por qué.

   Esto responde otra pregunta: QUÉ se rompió, CUÁNTO falta y QUÉ pasaría si
   cambias este día por este otro. Es determinista — cuenta y compara, no
   interpreta — así que corre entero dentro del teléfono, sin servidor.

   Separación deliberada: acá viven las REGLAS. Los datos del menú viven en la
   base. Mezclarlos fue lo que nos tuvo cambiando literales por todo el HTML.
   ========================================================================== */
(function (root) {
  "use strict";

  /* Frecuencias de la pauta (nutricionista, 25-jun-2026).
     Suman 10 en 7 días porque un plato cuenta en más de una categoría:
     lentejas con arroz es legumbre Y cereal.                                */
  var CATS = {
    legumbre: { label: "Legumbres",         porSemana: 3 },
    cereal:   { label: "Arroz / pasta",     porSemana: 2 },
    guiso:    { label: "Guiso tradicional", porSemana: 1 },
    pescado:  { label: "Pescado",           porSemana: 2 },
    ave:      { label: "Pollo / pavo",      porSemana: 2 },
    /* Carne roja: Julián puede comer, poco. Es un TOPE (máximo semanal),
       no una obligación: cero está perfecto, dos ya es aviso. El número es
       ajustable si la pauta de la nutricionista dice otra cosa. */
    carne:    { label: "Carne roja",         maxSemana: 1 }
  };

  /* Régimen hiposódico. No es una preferencia: es indicación médica para uno
     de los niños. Se busca en el texto de ingredientes y del nombre.        */
  var PROHIBIDO = [
    { re: /\bcubit|caldo\s+(en\s+)?(cubo|polvo)|knorr|maggi/i,
      que: "cubo o caldo concentrado", por: "sodio" },
    { re: /\bmargarina/i,             que: "margarina",           por: "indicación" },
    { re: /\b(cecina|vienesa|salchich|jam[oó]n|mortadela|paté|chorizo|tocino|longaniza)/i,
      que: "embutido o cecina",       por: "sodio" },
    { re: /\bsal\b/i,                que: "sal añadida",         por: "sodio" },
    { re: /\bsalsa\s+de\s+soya|s(o|ó)ya\s+salsa|ketchup|mayonesa\s+industrial/i,
      que: "salsa industrial",        por: "sodio" },
    { re: /\bqueso\s+(parmesano|azul|rallado\s+industrial)/i,
      que: "queso muy salado",        por: "sodio" }
  ];

  var DIAS = ["lunes","martes","miércoles","jueves","viernes","sábado","domingo"];

  function catsDe(r) {
    if (!r) return [];
    return r.cats || (r.cat ? [r.cat] : []);
  }

  function contar(menu, recetas) {
    var c = {};
    Object.keys(CATS).forEach(function (k) { c[k] = 0; });
    (menu || []).forEach(function (id) {
      catsDe(recetas[id]).forEach(function (k) { if (c[k] !== undefined) c[k]++; });
    });
    return c;
  }

  /* -------------------------------------------------------------- validar */
  function validar(menu, recetas, opts) {
    opts = opts || {};
    var errores = [], avisos = [], conteo = contar(menu, recetas);

    // 1. Días sin definir
    var vacios = [];
    (menu || []).forEach(function (id, i) {
      if (!id || !recetas[id]) vacios.push(DIAS[i]);
    });
    if (vacios.length)
      avisos.push({ tipo: "vacio",
        texto: vacios.length === 7 ? "La semana está vacía"
             : "Sin definir: " + vacios.join(", ") });

    // 2. Frecuencias de la pauta. Dos semánticas:
    //    porSemana = cantidad exacta (obligación) · maxSemana = tope (opcional)
    Object.keys(CATS).forEach(function (k) {
      var hay = conteo[k];
      if (CATS[k].maxSemana != null) {
        if (hay > CATS[k].maxSemana)
          avisos.push({ tipo: "tope", cat: k, delta: hay - CATS[k].maxSemana,
            texto: CATS[k].label + ": " + hay + " — el tope es " + CATS[k].maxSemana + " por semana" });
        return;
      }
      var meta = CATS[k].porSemana, d = hay - meta;
      if (d === 0) return;
      var t = CATS[k].label + ": " + hay + " de " + meta;
      (d < 0 ? errores : avisos).push({
        tipo: d < 0 ? "falta" : "sobra", cat: k, delta: d,
        texto: d < 0 ? t + " — faltan " + (-d) : t + " — " + d + " de más"
      });
    });

    // 3. Repetición: el mismo plato dos días muy seguidos cansa y desperdicia
    //    la lógica de tandas, que ya reparte los excedentes.
    var minDias = opts.repetirTrasDias || 2;
    for (var i = 0; i < (menu || []).length; i++) {
      for (var j = i + 1; j < menu.length && j - i <= minDias; j++) {
        if (menu[i] && menu[i] === menu[j])
          avisos.push({ tipo: "repite", texto:
            (recetas[menu[i]] ? recetas[menu[i]].name : menu[i])
            + " se repite " + DIAS[i] + " y " + DIAS[j] });
      }
    }

    // 4. Régimen hiposódico
    (menu || []).forEach(function (id, i) {
      var r = recetas[id];
      if (!r) return;
      /* «Cazuela de pollo (sin sal)» no lleva sal: la lleva escrita. Las
         negaciones se limpian ANTES de buscar, o el motor reta a quien está
         cumpliendo, que es la peor forma de perder confianza en una alerta. */
      var texto = [r.name, r.nota, (r.ingredientes || []).join(" ")]
        .filter(Boolean).join(" ")
        .replace(/\b(sin|libre de|cero|bajo en|reducido en|no|nunca|jamás)\s+(sal|sodio|agregar sal|azúcar|cubitos?|caldos?( concentrados?)?)\b/gi, " ")
        .replace(/\bhiposódic\w*|\bsin agregar\b/gi, " ");
      PROHIBIDO.forEach(function (p) {
        if (p.re.test(texto))
          errores.push({ tipo: "sodio", dia: i, texto:
            DIAS[i] + " · " + r.name + ": " + p.que + " (" + p.por + ")" });
      });
    });

    return {
      ok: errores.length === 0,
      errores: errores, avisos: avisos, conteo: conteo,
      resumen: Object.keys(CATS).map(function (k) {
        var m = CATS[k].maxSemana != null ? "≤" + CATS[k].maxSemana : String(CATS[k].porSemana);
        return CATS[k].label + " " + conteo[k] + "/" + m;
      }).join(" · ")
    };
  }

  /* ------------------------------------------------------------- impacto --
     Qué pasaría si el día `idx` pasara a ser `nuevoId`. Es lo que permite
     avisar ANTES de guardar, en vez de retar después.                       */
  function impacto(menu, idx, nuevoId, recetas, opts) {
    var antes = validar(menu, recetas, opts);
    var copia = (menu || []).slice();
    copia[idx] = nuevoId;
    var despues = validar(copia, recetas, opts);

    var clave = function (v) { return v.tipo + "|" + (v.cat || "") + "|" + v.texto; };
    var previos = {};
    antes.errores.concat(antes.avisos).forEach(function (v) { previos[clave(v)] = 1; });

    var nuevos = despues.errores.concat(despues.avisos)
      .filter(function (v) { return !previos[clave(v)]; });

    return {
      antes: antes, despues: despues, nuevos: nuevos,
      rompe: despues.errores.length > antes.errores.length,
      arregla: despues.errores.length < antes.errores.length
    };
  }

  /* Qué categorías faltan — para proponer reemplazos que arreglen en vez de
     ofrecer cualquier receta.                                               */
  function sugerencias(menu, recetas, opts) {
    var v = validar(menu, recetas, opts);
    var faltan = v.errores.filter(function (e) { return e.tipo === "falta"; })
                          .map(function (e) { return e.cat; });
    if (!faltan.length) return [];
    return Object.keys(recetas).filter(function (id) {
      return catsDe(recetas[id]).some(function (c) { return faltan.indexOf(c) >= 0; });
    });
  }

  var API = { CATS: CATS, DIAS: DIAS, validar: validar, impacto: impacto,
              sugerencias: sugerencias, contar: contar, PROHIBIDO: PROHIBIDO };
  root.Pauta = API;
  if (typeof module !== "undefined" && module.exports) module.exports = API;
})(typeof globalThis !== "undefined" ? globalThis : this);
</script>

function normalizar(s){
  return String(s==null?"":s).toLowerCase().trim()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();
}
/* Texto libre → producto del catálogo. null si no reconoce nada. */
function resolverProducto(texto){
  const q = normalizar(texto);
  if(!q) return null;
  let mejor=null, score=0;
  for(const p of CATALOGO){
    for(const alias of p.a){
      const na = normalizar(alias);
      let s = 0;
      if(q===na) s=100;
      else if(q.startsWith(na+" ")||q.endsWith(" "+na)) s=80;
      else if(q.includes(na) && na.length>=4) s=60+na.length;
      else if(na.includes(q) && q.length>=4) s=40+q.length;
      if(s>score){ score=s; mejor=p; }
    }
  }
  return mejor ? {prod:mejor, exacto:score>=80} : null;
}

/* ================= REGLA DE LA CASA: SIN AJO =================
   Ninguna receta con ajo entra a esta casa. La guardia limpia
   ingredientes y textos de todo lo que llegue de la base — recetas
   viejas, nuevas, propuestas o manuales. Permanente e idempotente. */
function sinAjo(rec){
  if(!rec || typeof rec !== "object") return rec;
  const limpiaTxt = s => typeof s === "string"
    ? s.replace(/,\s*ajos?\b/gi,"").replace(/\bajos?\s+y\s+/gi,"")
       .replace(/\s+y\s+ajos?\b/gi,"").replace(/\bcon\s+ajos?\b/gi,"con")
       .replace(/-ajos?-/gi,"-").replace(/\bajos?\b,?\s*/gi,"")
       .replace(/\s{2,}/g," ").replace(/\s+([,.;])/g,"$1").replace(/con\s*([,.;])/g,"$1").trim()
    : s;
  Object.values(rec).forEach(r=>{
    if(!r || typeof r !== "object") return;
    if(Array.isArray(r.ings)) r.ings = r.ings.filter(p=>!/\bajos?\b/i.test(String(p&&p[0]||"")));
    if(Array.isArray(r.steps)) r.steps = r.steps.map(limpiaTxt);
    ["julian","nota","name"].forEach(k=>{ if(r[k]) r[k] = limpiaTxt(r[k]); });
  });
  return rec;
}

<script>/* ============================================================================
   Control de la Casa · v2
   ----------------------------------------------------------------------------
   Reconcebido: no es un editor con pestañas, es el lugar donde B interactúa
   con el sistema. Tres verbos:
     PROPONER — Claude arma la semana (Edge Function), pauta.js la verifica
                acá mismo, B aprueba con el dedo. Nada se escribe solo.
     DECIR    — "falta palta" se resuelve al producto exacto de Jumbo con el
                mismo catálogo de la cocina. Determinista, sin servidor.
     SUBIR    — recetas médicas y referentes. Próxima entrega; se dice así.
   El editor manual sigue existiendo, pero como pantalla secundaria.
   ========================================================================== */
"use strict";

/* Este archivo sólo vive servido desde la web. Abierto con doble clic desde
   Descargas parece funcionar a medias y confunde — mejor que se explique. */
if(location.protocol === "file:"){
  document.addEventListener("DOMContentLoaded", () => {
    document.body.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#FAF7F0;color:#1C2026;font-family:system-ui;text-align:center;padding:30px"><div style="max-width:440px"><div style="font-weight:800;font-size:1.3rem">Este archivo no es la app</div><div style="width:60px;height:5px;background:#F0A834;border-radius:3px;margin:14px auto 18px"></div><p style="line-height:1.6;font-size:.95rem">Este archivo es para <b>subirlo a GitHub</b>. La app vive siempre en:</p><p><a href="https://benjaira.github.io/central-casa/control/" style="color:#4a6d8c;font-weight:700;word-break:break-all">benjaira.github.io/central-casa/control/</a></p><p style="font-size:.82rem;color:#8a8578;line-height:1.5">Abierto desde el disco no puede sincronizar ni actualizarse.</p></div></div>';
  });
  throw new Error("file:// - este archivo se sube, no se abre");
}


const DIAS  = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
let S = Store.create({ prefix:"", shared:true });
let MODO = "local";
let DRV = null;

const estado = {
  vista: "home",
  semana: null,
  menu: [],
  recetas: {},
  falta: [],
  propuesta: null,
  proponiendo: false,
  sucio: false,
  cargando: true
};

/* La cocina identifica la semana por la FECHA DEL LUNES (menu:2026-08-03).
   Una sola fórmula para ambas apps. */
function lunesDe(){ const d = new Date(); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return d; }
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function claveSemana(){ return iso(lunesDe()); }
function fechaCorta(i){ const d = lunesDe(); d.setDate(d.getDate()+i); return d.getDate()+" "+MESES[d.getMonth()]; }
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ------------------------------------------------------------------ datos */
async function cargar(){
  estado.cargando = true; pintar();
  estado.semana  = claveSemana();
  try{
    const _semP = iso(lunesProx());
    const _sl = await S.get("shoplist:" + _semP, null);
    if(_sl && _sl.carro){ estado.shoplist = _sl; }
    else {
      const _mp = await S.get("menu:" + _semP, null);
      if(Array.isArray(_mp) && _mp.length === 7){
        estado.shoplist = Object.assign({ semana:_semP }, construirLista(_mp));
        try{ await S.set("shoplist:" + _semP, estado.shoplist); }catch(_){}
      } else estado.shoplist = null;
    }
  }catch(_){ estado.shoplist = null; }
  let base       = sinAjo((await S.get("recetas:base", null)) || {});
  /* Sanado único: si la base en Central aún trae ajo, se limpia y se
     re-publica limpia. Después de eso, la guardia sólo vigila. */
  if(MODO === "nube" && JSON.stringify(base) !== JSON.stringify((await S.get("recetas:base", null)) || {})){
    try{ await S.set("recetas:base", base); }catch(e){}
  }
  /* Siembra: si la base está vacía y hay conexión, Control la puebla él
     mismo con las recetas de fábrica (extraídas de cocina en el ensamblado).
     Antes esto dependía de "abrir Cocina en algún dispositivo" — una cadena
     de suerte, no un sistema. Ambas apps saben sembrar; gana la primera.    */
  if(!Object.keys(base).length && MODO === "nube"
     && typeof RECETAS_BASE !== "undefined"){
    try{
      await S.set("recetas:base", RECETAS_BASE);
      base = RECETAS_BASE;
      aviso("Recetario de fábrica publicado a la base");
    }catch(e){}
  }
  /* Recetario ampliado: se suman las recetas nuevas que la base aún no
     tenga. Regla dura: NUNCA pisar un id existente — si B editó una receta,
     su versión manda para siempre. */
  if(MODO === "nube" && typeof RECETAS_EXTRA !== "undefined"){
    const faltantes = Object.keys(RECETAS_EXTRA).filter(id => !base[id]);
    if(faltantes.length){
      try{
        faltantes.forEach(id => base[id] = RECETAS_EXTRA[id]);
        await S.set("recetas:base", base);
        aviso(faltantes.length + " recetas nuevas sumadas al recetario");
      }catch(e){}
    }
  }
  const propias  = (await S.get("recetario", null))    || {};
  estado.recetas = Object.assign({}, base, propias);
  let m = await S.get("menu:" + estado.semana, null);
  if(!(Array.isArray(m) && m.length === 7) && MODO === "nube"
     && Object.keys(base).length && typeof MENU_POR_DEFECTO !== "undefined"){
    try{ m = MENU_POR_DEFECTO.slice(); await S.set("menu:" + estado.semana, m); }catch(e){}
  }
  estado.menu  = (Array.isArray(m) && m.length === 7) ? m.slice() : new Array(7).fill(null);
  estado.falta = (await S.get("falta", null)) || [];
  estado.sucio = false;
  estado.cargando = false;
  pintar();
}

async function guardarMenu(origen){
  const v = Pauta.validar(estado.menu, estado.recetas);
  const graves = v.errores.filter(e => e.tipo === "sodio");
  if(graves.length && !confirm("Este menú tiene " + graves.length
      + " plato(s) que rompen el régimen sin sal:\n\n"
      + graves.map(e => "· " + e.texto).join("\n") + "\n\n¿Guardar igual?")) return false;
  await S.set("menu:" + estado.semana, estado.menu);
  try{ if(DRV) await DRV.anotar("menu_guardado", "control",
        { semana: estado.semana, menu: estado.menu, origen: origen || "manual" }); }catch(e){}
  estado.sucio = false;
  aviso("Menú guardado · la tablet ya lo tiene");
  pintar();
  return true;
}

/* Guarda releyendo antes — mismo patrón que la cocina — para no pisar lo
   que la casa anotó mientras esto estaba abierto. */
async function guardarFalta(){
  const remoto = (await S.get("falta", null)) || [];
  const mios = new Set(estado.falta.map(i => i && i.id).filter(Boolean));
  const otros = remoto.filter(i => i && i.id && !mios.has(i.id));
  estado.falta = [...estado.falta, ...otros];
  await S.set("falta", estado.falta);
  pintar();
}

/* --------------------------------------------------------------- proponer */
async function proponer(){
  if(MODO !== "nube") return aviso("Sin conexión con la base");
  if(estado.proponiendo) return;
  estado.proponiendo = true; pintar();
  try{
    /* Los tokens de sesión viven una hora y la PWA congelada en segundo
       plano no los refresca sola: el invoke salía con credencial vencida y
       el portero de Supabase lo rebotaba con un 401 mudo. Acá se refresca
       la sesión y se manda el token fresco explícito, siempre. */
    try{ await DRV._sb.auth.refreshSession(); }catch(_){}
    const ses = await DRV._sb.auth.getSession();
    const tok = ses && ses.data && ses.data.session && ses.data.session.access_token;
    const r = await DRV._sb.functions.invoke("casa-ia", {
      body: { accion: "proponer_semana" },
      headers: tok ? { Authorization: "Bearer " + tok } : {}
    });
    if(r.error){
      /* La función responde errores con nombre y apellido en el cuerpo
         ("falta ANTHROPIC_API_KEY…", "Anthropic 401: …"). supabase-js los
         esconde tras un mensaje genérico; acá se rescatan y se muestran. */
      let detalle = r.error.message || "error de la función";
      const ctx = r.error.context;
      if(ctx && typeof ctx.json === "function"){
        try{
          const j = await ctx.json();
          if(j) detalle = j.error || j.message || j.msg || (j.code ? String(j.code) : detalle);
        }catch(_){}
        if(ctx.status) detalle = "[" + ctx.status + "] " + detalle;
      }
      throw new Error(detalle);
    }
    const d = r.data;
    if(!d || !d.ok) throw new Error((d && d.error) || "respuesta vacía");
    /* El modelo propone; el teléfono verifica. La confianza está en pauta.js,
       no en la promesa del modelo. */
    estado.propuesta = { menu: d.menu, razon: d.razon,
                         val: Pauta.validar(d.menu, estado.recetas) };
  }catch(e){
    const t = String(e.message || e);
    aviso(t.indexOf("Failed to fetch") >= 0 || t.indexOf("FunctionsFetchError") >= 0
      ? "La función casa-ia no está publicada todavía"
      : "No se pudo proponer: " + t.slice(0, 180));
  }
  estado.proponiendo = false; pintar();
}

async function aprobarPropuesta(){
  /* El Ritual del domingo arma la semana que PARTE mañana, no la que muere
     hoy. Y aprobar no es sólo fijar el menú: es dejar la lista de Jumbo
     armada, resuelta contra el catálogo de la casa. */
  const p = estado.propuesta;
  const destino = iso(lunesProx());
  const graves = p.val.errores.filter(e => e.tipo === "sodio");
  if(graves.length && !confirm("Este menú tiene " + graves.length
      + " plato(s) que rompen el régimen sin sal:\n\n"
      + graves.map(e => "· " + e.texto).join("\n") + "\n\n¿Aprobar igual?")) return;
  await S.set("menu:" + destino, p.menu);
  const lista = construirLista(p.menu);
  await S.set("shoplist:" + destino, lista);
  estado.shoplist = Object.assign({ semana: destino }, lista);
  try{ if(DRV) await DRV.anotar("menu_guardado", "control",
        { semana: destino, menu: p.menu, origen: "claude" + (p.editada ? "+editado" : "") }); }catch(e){}
  estado.propuesta = null;
  aviso("Semana del " + fechaCortaProx() + " aprobada · lista Jumbo armada");
  pintar();
}

function lunesProx(){
  /* El lunes de MAÑANA: corrido en domingo apunta a la semana que parte;
     corrido lunes o después, a la semana en curso. Nunca dos adelante. */
  const d = new Date(); d.setDate(d.getDate() + 1);
  d.setDate(d.getDate() - ((d.getDay()+6)%7));
  return d;
}
function fechaCortaProx(){ const d = lunesProx();
  return d.getDate() + " " + MESES[d.getMonth()]; }

/* La lista de Jumbo nace del menú aprobado: ingredientes de los 7 platos,
   agregados por nombre, resueltos contra el catálogo de productos de la
   casa. Las recetas sin detalle de compra quedan nombradas, no escondidas. */
function construirLista(ids){
  /* El objetivo no es recordar cucharadas: es CARGAR JUMBO. Cada ingrediente
     se traduce al producto del historial de la casa, y la frecuencia real de
     compra decide su destino: lo habitual va AL CARRO, lo ocasional a
     REVISAR STOCK, y lo sin producto queda A MANO. */
  const porProd = {}, mano = {}, sinDet = [];
  ids.forEach(id => {
    const r = estado.recetas[id]; if(!r) return;
    if(!Array.isArray(r.ings) || !r.ings.length){ sinDet.push(r.name); return; }
    r.ings.forEach(par => {
      const ing = String(par[0]||"").trim(); if(!ing) return;
      const rp = resolverProducto(ing);
      if(rp && rp.prod){
        const p = rp.prod;
        if(!porProd[p.id]) porProd[p.id] = { id:p.id, n:p.n, c:p.c||"", f:p.f||0, un:p.q||1, precio:precioTxt(p), platos:{} };
        porProd[p.id].platos[r.name] = 1;
      } else { mano[ing] = 1; }
    });
  });
  const todos = Object.values(porProd).map(x =>
    ({ n:x.n, un:x.un, precio:x.precio, platos:Object.keys(x.platos), f:x.f, c:x.c }));
  const orden = (a,b)=>a.n.localeCompare(b.n);
  /* Frescos que el menú pide: SIEMPRE al carro. Sólo la despensa de baja
     frecuencia (abarrotes, conservas) queda en "revisar stock". */
  const esDespensa = x => /abarrote|despensa|conserva|congelad/i.test(x.c||"");
  const carro = todos.filter(x => x.f>=6 || !esDespensa(x)).sort(orden);
  const stock = todos.filter(x => x.f<6  &&  esDespensa(x)).sort(orden);
  const num = s => Number(String(s).replace(/[^0-9]/g,"")) || 0;
  const totalCarro = carro.reduce((t,x)=>t+num(x.precio)*x.un, 0);
  return { carro, stock, mano:Object.keys(mano).sort(), sinDet, totalCarro };
}
function fmtCLP(v){ return "$" + Number(v||0).toLocaleString("es-CL"); }
function textoLista(){
  const s = estado.shoplist; if(!s || !s.carro) return "";
  const linea = x => "· " + x.n + (x.un>1 ? " ×"+x.un : "") + " — " + x.precio;
  let t = "PEDIDO JUMBO · semana del " + fechaCortaProx();
  if(s.carro.length) t += "\n\nAL CARRO · " + fmtCLP(s.totalCarro) + "\n" + s.carro.map(linea).join("\n");
  if(s.stock.length) t += "\n\nREVISAR STOCK (compra ocasional)\n" + s.stock.map(linea).join("\n");
  if(s.mano.length)  t += "\n\nA MANO\n· " + s.mano.join(" · ");
  if(s.sinDet && s.sinDet.length) t += "\n\n(sin ingredientes cargados: " + s.sinDet.join(", ") + ")";
  return t;
}

function copiarViejaEscuela(texto){
  /* execCommand está "obsoleto" hace años y sigue siendo lo único que el
     iPhone respeta sin peros dentro de una PWA. La vieja escuela funciona. */
  try{
    const ta = document.createElement("textarea");
    ta.value = texto; ta.setAttribute("readonly","");
    ta.style.position = "fixed"; ta.style.left = "-9999px"; ta.style.top = "0";
    document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, texto.length);
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  }catch(_){ return false; }
}

/* ----------------------------------------------------------------- pintar */
function pintar(){
  const app = document.getElementById("app");
  if(estado.cargando){ app.innerHTML = '<div class="vacio">Cargando…</div>'; return; }
  app.innerHTML = estado.vista === "editar"  ? vistaEditar()
                : estado.vista === "recetas" ? vistaRecetas()
                : vistaHome();
  const b = document.getElementById("barra-guardar");
  b.classList.toggle("on", estado.sucio && estado.vista === "editar");
  const atras = document.getElementById("atras");
  atras.style.display = estado.vista === "home" ? "none" : "";
}

/* Precio en pantalla: si el producto varió ≥25% o su precio tiene más de 60
   días, se muestra con "≈". Mismo criterio que la cocina, autocontenido acá
   — depender de una función de otro archivo fue lo que congeló la v2.2. */
function precioTxt(p){
  if(!p || !p.p) return "";
  const viejo = p.pF && (Date.now() - new Date(p.pF + "T12:00:00")) > 60*86400000;
  return (p.vol || viejo ? "\u2248 $" : "$") + p.p.toLocaleString("es-CL");
}

function chipPauta(v){
  return '<div class="pcs">' + Object.keys(Pauta.CATS).map(k => {
    const c = Pauta.CATS[k], hay = v.conteo[k];
    let cl, meta;
    if(c.maxSemana != null){          // tope: cero es perfecto, pasarse es warn
      meta = "≤" + c.maxSemana;
      cl = hay <= c.maxSemana ? "ok" : "warn";
    } else {
      meta = String(c.porSemana);
      cl = hay === c.porSemana ? "ok" : (hay < c.porSemana ? "mal" : "warn");
    }
    return '<span class="pc ' + cl + '">' + esc(c.label)
         + ' <b>' + hay + '/' + meta + '</b></span>';
  }).join("") + '</div>';
}

function vistaHome(){
  const sinRecetas = !Object.keys(estado.recetas).length;
  if(sinRecetas)
    return '<div class="vacio">La base todavía no tiene recetas.<br><br>'
      + 'Abre <b>Cocina</b> una vez en cualquier dispositivo y esto se llena solo.</div>';

  const v = Pauta.validar(estado.menu, estado.recetas);
  let h = "";

  if(estado.propuesta){
    const p = estado.propuesta;
    h += '<div class="tarjeta prop"><div class="tt">PROPUESTA DE CLAUDE · SEMANA DEL '
      + fechaCortaProx().toUpperCase() + '</div>'
      + '<div class="lista">' + p.menu.map((id,i) =>
          '<div class="fila"><div class="dia"><b>' + DIAS[i].slice(0,3) + '</b></div>'
          + '<select data-pdia="' + i + '" class="sel">' + opcionesAgrupadas(id)
          + '</select></div>').join("") + '</div>'
      + (p.razon ? '<div class="razon">' + esc(p.razon) + '</div>' : "")
      + chipPauta(p.val)
      + (p.val.ok ? '<div class="pok">Verificado acá: cuadra con la pauta</div>'
                  : '<ul class="pv">' + p.val.errores.map(e =>
                      '<li class="e">' + esc(e.texto) + '</li>').join("") + '</ul>')
      + '<div class="mini">Cambia el plato de cualquier día antes de aprobar.</div>'
      + '<div class="botones">'
      + '<button class="primario" data-aprobar>Aprobar · semana del ' + fechaCortaProx() + '</button>'
      + '<button class="secundario" data-descartar>Descartar</button></div></div>';
  }

  h += '<div class="tarjeta"><div class="tt">SEMANA DEL '
    + fechaCorta(0).toUpperCase() + '</div>'
    + '<div class="dias toca" data-ir="editar">' + estado.menu.map((id,i) =>
        '<div class="d' + (i === (new Date().getDay()+6)%7 ? " hoy" : "") + '">'
        + '<span>' + DIAS[i].slice(0,3) + '</span><b>'
        + esc(id && estado.recetas[id] ? estado.recetas[id].name : "— sin definir —")
        + '</b></div>').join("") + '</div>'
    + chipPauta(v)
    + '<div class="mini">Tocar la semana para editarla a mano</div></div>';

  if(estado.shoplist && estado.shoplist.carro){
    const s = estado.shoplist;
    const fila = x => '<div class="fitem"><div class="txt">' + esc(x.n) + (x.un>1 ? ' ×'+x.un : '')
      + ' <span class="sub">' + esc(x.precio)
      + (x.platos && x.platos.length ? ' · para: ' + esc(x.platos.join(", ")) : '') + '</span></div></div>';
    h += '<div class="tarjeta"><div class="tt">PEDIDO JUMBO · SEMANA DEL '
      + fechaCortaProx().toUpperCase() + '</div>'
      + (s.carro.length ? '<div class="mini" style="font-weight:800">AL CARRO · ' + fmtCLP(s.totalCarro) + '</div>'
          + '<div class="flist">' + s.carro.map(fila).join("") + '</div>' : '')
      + (s.stock.length ? '<div class="mini" style="font-weight:800;margin-top:8px">REVISAR STOCK · compra ocasional</div>'
          + '<div class="flist">' + s.stock.map(fila).join("") + '</div>' : '')
      + (s.mano.length ? '<div class="mini" style="margin-top:8px"><b>A mano:</b> ' + esc(s.mano.join(" · ")) + '</div>' : '')
      + (s.sinDet && s.sinDet.length ? '<div class="mini">Sin ingredientes cargados: ' + esc(s.sinDet.join(", ")) + '</div>' : '')
      + '<div class="botones">'
      + (navigator.share ? '<button class="primario" data-compartir-lista>Compartir</button>' : '')
      + '<button class="' + (navigator.share ? 'secundario' : 'primario') + '" data-copiar-lista>Copiar</button></div></div>';
  }

  if(!estado.propuesta)
    h += '<button class="accion" data-proponer' + (estado.proponiendo ? " disabled" : "") + '>'
      + (estado.proponiendo ? "Armando la semana…" : "✦ Que Claude proponga la semana")
      + '</button>';

  h += '<div class="tarjeta"><div class="tt">FALTA ALGO</div>'
    + '<div class="agregar"><input id="nueva-falta" placeholder="palta, pañales, detergente…" '
    + 'autocomplete="off" enterkeyhint="done"><button data-add-falta>Anotar</button></div>'
    + (estado.falta.length ? '<div class="flist">' + estado.falta.map((f,i) => {
        const p = f.prodId && typeof PRODS !== "undefined" ? PRODS[f.prodId] : null;
        return '<div class="fitem"><div class="txt">' + esc(f.name || f)
          + (p ? '<span class="sub">' + esc(p.n) + ' · ' + precioTxt(p) + '</span>' : "")
          + '</div><button class="x" data-quitar="' + i + '">✕</button></div>';
      }).join("") + '</div>' : '<div class="mini">La casa no ha anotado nada.</div>')
    + '</div>';

  h += '<div class="tarjeta off"><div class="tt">SUBIR</div>'
    + '<div class="mini">Recetas médicas y referentes de alimentación. '
    + 'Es la próxima entrega: se sube la foto y se procesa sola. Por ahora, '
    + 'esos documentos van al proyecto de Claude, como siempre.</div></div>';

  h += '<button class="enlace" data-ir="recetas">Ver y agregar recetas →</button>';
  return h;
}

const DIFF = {1:"fácil", 2:"media", 3:"elaborada"};
function rotulo(r){
  const extra = [r.time, DIFF[r.diff]].filter(Boolean).join(" · ");
  return esc(r.name) + (extra ? "  —  " + extra : "");
}
function catsDe(r){ return r ? (r.cats || (r.cat ? [r.cat] : [])) : []; }

/* Al cambiar un plato, primero se ofrecen los de SU MISMA categoría — el
   cambio típico es "otra legumbre", no "cualquier cosa" — y después el resto,
   agrupado por categoría, cada uno con su tiempo y dificultad. */
function opcionesAgrupadas(actualId){
  const cats = catsDe(estado.recetas[actualId]);
  const catPrincipal = cats[0] || null;
  const grupos = {};
  Object.keys(estado.recetas).forEach(k => {
    const c = catsDe(estado.recetas[k])[0] || "otros";
    (grupos[c] = grupos[c] || []).push(k);
  });
  const orden = catPrincipal
    ? [catPrincipal, ...Object.keys(Pauta.CATS).filter(c => c !== catPrincipal), "otros"]
    : [...Object.keys(Pauta.CATS), "otros"];
  let h = '<option value=""' + (actualId ? "" : " selected") + '>— sin definir —</option>';
  orden.forEach(c => {
    if(!grupos[c] || !grupos[c].length) return;
    const label = (Pauta.CATS[c] ? Pauta.CATS[c].label : "Otros")
                + (c === catPrincipal ? " · misma categoría" : "");
    h += '<optgroup label="' + esc(label) + '">'
      + grupos[c].sort((a,b) => (estado.recetas[a].diff||9)-(estado.recetas[b].diff||9))
          .map(k => '<option value="' + esc(k) + '"' + (k===actualId ? " selected":"") + '>'
                  + rotulo(estado.recetas[k]) + '</option>').join("")
      + '</optgroup>';
    delete grupos[c];
  });
  return h;
}

function vistaEditar(){
  const hoy = (new Date().getDay()+6)%7;
  return '<div class="lista">' + estado.menu.map((id,i) =>
    '<div class="fila' + (i===hoy ? " hoy" : "") + '">'
    + '<div class="dia"><b>' + DIAS[i] + '</b><span>' + fechaCorta(i) + '</span></div>'
    + '<select data-idx="' + i + '" class="sel">' + opcionesAgrupadas(id)
    + '</select></div>').join("") + '</div>'
  + '<div class="tarjeta" style="margin-top:14px">' + chipPauta(Pauta.validar(estado.menu, estado.recetas)) + '</div>';
}

function vistaRecetas(){
  const ks = Object.keys(estado.recetas);
  return '<div class="lista">' + ks.map(k => {
      const r = estado.recetas[k];
      return '<div class="fila"><div class="txt">' + esc(r.name)
        + '<span class="sub">' + esc((r.cats||[r.cat]).filter(Boolean).join(", ") || "sin categoría")
        + (r.tanda ? " · " + r.tanda + " porc." : "") + '</span></div></div>';
    }).join("") + '</div>'
  + '<div class="agregar col">'
  + '<input id="nr-nombre" placeholder="Nombre de la receta">'
  + '<div class="par"><input id="nr-cat" placeholder="Categorías (legumbre, cereal…)">'
  + '<input id="nr-tanda" type="number" inputmode="numeric" placeholder="Porciones"></div>'
  + '<button data-add-receta>Agregar receta</button></div>'
  + '<p class="nota">Queda disponible en la cocina y en las propuestas de Claude de inmediato.</p>';
}

function aviso(t){
  const e = document.getElementById("toast");
  e.textContent = t; e.classList.add("on");
  clearTimeout(aviso._t); aviso._t = setTimeout(() => e.classList.remove("on"), 3200);
}

/* --------------------------------------------------------------- eventos */
document.addEventListener("change", e => {
  if(e.target && e.target.dataset && e.target.dataset.pdia != null && estado.propuesta){
    estado.propuesta.menu[Number(e.target.dataset.pdia)] = e.target.value;
    estado.propuesta.editada = true;
    estado.propuesta.val = Pauta.validar(estado.propuesta.menu, estado.recetas);
    return pintar();
  }
  const s = e.target.closest("select[data-idx]");
  if(!s) return;
  const i = Number(s.dataset.idx);
  const im = Pauta.impacto(estado.menu, i, s.value || null, estado.recetas);
  estado.menu[i] = s.value || null;
  estado.sucio = true;
  pintar();
  if(im.nuevos.length) aviso((im.rompe ? "⚠ " : "") + im.nuevos[0].texto);
  else if(im.arregla) aviso("Con eso queda dentro de la pauta ✓");
});

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-ir],[data-proponer],[data-aprobar],[data-descartar],[data-compartir-lista],[data-copiar-lista],[data-quitar],[data-add-falta],[data-add-receta],#guardar,#atras");
  if(!t) return;

  if(t.id === "atras" || t.dataset.ir === "home"){ estado.vista = "home"; return pintar(); }
  if(t.dataset.ir){ estado.vista = t.dataset.ir; return pintar(); }
  if(t.hasAttribute("data-proponer")) return proponer();
  if(t.hasAttribute("data-aprobar"))  return aprobarPropuesta();
  if(t.hasAttribute("data-compartir-lista")){
    /* La hoja nativa de iOS: WhatsApp, Notas, lo que sea. En PWA instalada
       es el camino que nunca falla. */
    try{ await navigator.share({ text: textoLista() }); }
    catch(err){ if(!err || err.name !== "AbortError"){
      let ok = false;
      try{ await navigator.clipboard.writeText(textoLista()); ok = true; }catch(_){}
      if(!ok) ok = copiarViejaEscuela(textoLista());
      aviso(ok ? "No dejó compartir — la copié al portapapeles" : "El iPhone bloqueó compartir y copiar");
    } }
    return;
  }
  if(t.hasAttribute("data-copiar-lista")){
    const texto = textoLista();
    let ok = false;
    try{ await navigator.clipboard.writeText(texto); ok = true; }catch(_){}
    if(!ok) ok = copiarViejaEscuela(texto);
    aviso(ok ? "Lista copiada · pégala en Jumbo o WhatsApp"
             : "El iPhone no dejó copiar — usa Compartir");
    return;
  }
  if(t.hasAttribute("data-descartar")){ estado.propuesta = null; return pintar(); }
  if(t.id === "guardar") return guardarMenu("manual");

  if(t.dataset.quitar != null){
    estado.falta.splice(Number(t.dataset.quitar), 1);
    return guardarFalta();
  }
  if(t.hasAttribute("data-add-falta")){
    const inp = document.getElementById("nueva-falta");
    const txt = (inp.value || "").trim();
    if(!txt) return;
    const r = typeof resolverProducto === "function" ? resolverProducto(txt) : null;
    estado.falta.unshift({
      id: "f_" + Date.now().toString(36) + Math.random().toString(36).slice(2,5),
      name: txt, prodId: r ? r.prod.id : null, got: false, por: "control"
    });
    inp.value = "";
    aviso(r ? "«" + txt + "» → " + r.prod.n.slice(0,36) + " ✓" : "«" + txt + "» anotado ✓");
    return guardarFalta();
  }
  if(t.hasAttribute("data-add-receta")){
    const n = document.getElementById("nr-nombre").value.trim();
    if(!n) return aviso("Falta el nombre");
    const id = n.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
                .replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"").slice(0,28);
    if(estado.recetas[id]) return aviso("Ya existe una receta con ese nombre");
    const cats = document.getElementById("nr-cat").value.split(",")
                  .map(x=>x.trim().toLowerCase()).filter(Boolean);
    const r = { name:n, cats: cats.length ? cats : null,
                tanda: Number(document.getElementById("nr-tanda").value) || 8 };
    const propias = (await S.get("recetario", null)) || {};
    propias[id] = r;
    await S.set("recetario", propias);
    estado.recetas[id] = r;
    ["nr-nombre","nr-cat","nr-tanda"].forEach(x => document.getElementById(x).value = "");
    aviso("Receta agregada");
    pintar();
  }
});

/* --------------------------------------------------------------- arranque */
function marcarEstado(){
  const e = document.getElementById("estado");
  e.textContent = MODO === "nube" ? "● sincronizado" : "○ sin conexión";
  e.className = MODO === "nube" ? "ok" : "mal";
}

async function iniciarAlmacenamiento(){
  if(!globalThis.supabase || !globalThis.SupabaseDriver){
    MODO = "local"; marcarEstado();
    return pedirLlave("No se pudo cargar la librería de la base. ¿Hay internet?");
  }
  try{
    DRV = await SupabaseDriver({});
    S = Store.create({ driver: DRV, prefix:"" });
    MODO = "nube"; marcarEstado();
    DRV.onCambio(() => { S._limpiarCache(); if(!estado.sucio && !estado.propuesta) cargar(); });
  }catch(err){
    MODO = "local"; marcarEstado();
    pedirLlave(String(err.message||err).indexOf("SIN_CREDENCIALES") >= 0
      ? "" : "No se pudo entrar: " + (err.message || err));
  }
}

function pedirLlave(error){
  if(document.getElementById("llave")) return;
  const d = document.createElement("div");
  d.id = "llave";
  d.innerHTML =
    '<div class="lv-caja"><div class="lv-t">CONTROL DE LA CASA</div><div class="lv-ln"></div>'
  + '<p>Este dispositivo todavía no está conectado.<br>Pega el link de la casa.</p>'
  + '<textarea id="lv-txt" rows="4" placeholder="https://…"></textarea>'
  + '<div id="lv-err">' + (error||"") + '</div>'
  + '<button id="lv-ok">Conectar</button>'
  + '<small>Se pide una sola vez por dispositivo.</small></div>';
  document.body.appendChild(d);
  d.querySelector("#lv-ok").addEventListener("click", async () => {
    const txt = (d.querySelector("#lv-txt").value||"").trim();
    const err = d.querySelector("#lv-err");
    const i = txt.indexOf("#");
    if(i < 0) return err.textContent = "Ese link no trae la llave (le falta el # y lo que sigue).";
    const q = new URLSearchParams(txt.slice(i+1));
    const c = { url:q.get("u"), key:q.get("k"), email:q.get("e"), pass:q.get("p") };
    if(!c.url || !c.key || !c.email || !c.pass)
      return err.textContent = "Al link le falta alguno de los cuatro datos.";
    err.textContent = "Conectando…";
    try{
      localStorage.setItem("cc:cred", JSON.stringify(c));
      await iniciarAlmacenamiento();
      if(MODO !== "nube") throw new Error("no se pudo entrar");
      d.remove(); await cargar();
    }catch(e2){
      try{ localStorage.removeItem("cc:cred"); }catch(e3){}
      err.textContent = "No se pudo conectar. Revisa correo y contraseña.";
    }
  });
}

iniciarAlmacenamiento().then(cargar);
if("serviceWorker" in navigator) navigator.serviceWorker.register("../sw.js",{scope:"../"}).catch(()=>{});
